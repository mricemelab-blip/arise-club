为一种实践哲学（practical philosophy），它的目标并非理论知识的积累，而是个体生活的改善。\n\n#### 二、控制二分法：ta eph' hēmin 与 ta ouk eph' hēmin\n\n爱比克泰德（Epictetus, 约55-135）是罗马斯多葛学派最重要的代表之一。他出身奴隶，后获得自由，在尼科波利斯（Nicopolis）创办哲学学校。他的学生阿里安（Arrian）将其讲学整理为《手册》（Enchiridion，意为\"手册\"或\"手边之物\"）和《论说集》（Discourses）。\n\n《手册》开篇第一句即提出了斯多葛伦理学的基本原则：\n\n> \"在所有存在的事物中，有些在我们能力范围之内（ta eph' hēmin），有些不在我们能力范围之内（ta ouk eph' hēmin）。\"\n>\n> (Epictetus, *Enchiridion*, 1.1)\n\n这一区分被称为\"控制二分法\"（dichotomy of control）。它是斯多葛伦理学的基础架构，所有后续的伦理推论都从这一区分中推导出来。\n\n在控制之内的（ta eph' hēmin）：判断（hypolēpsis）、冲动（hormē）、欲望（orexis）、厌恶（ekklisis），所有属于我们自己的心理活动和意志行为。爱比克泰德明确列举：我们的判断（judgment）、我们的意图（impulse）、我们的欲望（desire）和我们的厌恶（aversion）。简言之，我们自己的行为和态度。\n\n不在控制之内的（ta ouk eph' hēmin）：身体（soma）、财产（ktēmata）、名声（doxa）、职位（archai），所有不属于我们自己的东西。爱比克泰德明确列举：我们的身体、我们的财产、我们的名声、我们的社会地位。简言之，他人和外部世界的事件。\n\n> \"在你能力范围内的事物，本质上是自由的，不受阻碍，不受限制。不在你能力范围内的事物是软弱的、奴隶般的、受阻碍的、不属于你自己的。\"\n>\n> (Epictetus, *Enchiridion*, 1.1-2)\n\n#### 三、斯多葛伦理学的实践推论\n\n从控制二分法可以直接推导出斯多葛伦理学的核心实践原则。\n\n如果一个人将幸福（eudaimonia）寄托在不在控制之内的东西上，身体的健康、财产的多寡、名声的有无，那么他的幸福就取决于他无法控制的外部条件。当这些外部条件变化（而它们必然会变化，因为人无法完全控制外部世界），他的幸福就被动摇了。痛苦（suffering）的根源在于将幸福寄托在不可控的事物上。\n\n反之，如果一个人只将幸福建立在可控的事物上，自己的判断、态度和行为，那么他的幸福就完全在他自己的能力范围之内。外部事件可以影响他的身体、财产和名声，但无法触及他的判断和意志。这样的人是自由的（free）。这种自由并非政治意义上的自由，而是哲学意义上的自由：不被外部事件所奴役的内在自由。\n\n爱比克泰德的论证逻辑是严格的：如果你的幸福取决于X，而X不在你的控制范围内，那么你的幸福就不在你的控制范围内。这等于将你最珍贵的东西交给你无法控制的力量。理性要求你将幸福只建立在你可以控制的事物上。\n\n斯多葛学派将这一原则推至极端。疾病、贫困、丧亲、流放，这些通常被认为是不幸的事件，在斯多葛框架中都不是真正的恶（evil）。真正的恶只有一种：错误的判断。真正的善（good）也只有一种：德性（virtue, aretē），即正确的判断和意志。外部事物（健康、财富、名声）被归类为\"无关紧要之物\"（adiaphora, indifferent things），它们不是善也不是恶，它们对幸福没有本质影响。\n\n#### 四、塞内加的 premeditatio malorum\n\n塞内加（Seneca, 约前4-65）是罗马斯多葛学派的另一位重要代表。他是尼禄皇帝的导师和大臣，最终以自杀告终。他的《道德书简》（Epistulae Morales）是斯多葛哲学最具可读性的文献之一。\n\n塞内加提出了一种精神训练方法：预想坏事（premeditatio malorum）。方法是：在心中预先想象可能降临的最坏情况，贫困、流放、疾病、丧亲、死亡。这种预想并非悲观主义，而是理性的准备。当你预先想象了最坏情况并认识到即使在那种情况下你仍然可以保持德性和内在自由时，你对最坏情况的恐惧就减弱了。\n\n塞内加在《道德书简》中写道：\n\n> \"他预先 anticipated 所有可能的不幸，仿佛身处敌人的领地。……命运的恩赐不是礼物，只是贷款。\"\n>\n> (Seneca, *Letters from a Stoic*, Letter 9)\n\npremeditatio malorum与控制二分法的关系是：通过预想最坏情况，你提前将注意力从不可控的外部事件转向可控的内在态度。当坏事真的发生时，你已经做好了心理准备。因为你知道，即使在最坏的情况下，你的判断和意志仍然在你手中。坏事发生了，但你对坏事的反应——你的判断和态度——仍然是你的选择。\n\n#### 五、马可·奥勒留的内省与自我对话\n\n马可·奥勒留（Marcus Aurelius, 121-180）是罗马皇帝，被称为\"哲学家皇帝\"。他的《沉思录》（Meditations）并非为出版而写的著作，而是个人的内省笔记，他在军营和政务中写给自己的提醒和告诫。\n\n《沉思录》的核心主题是控制二分法的内化。马可·奥勒留反复提醒自己：外部事件不在控制范围内，你对事件的判断在控制范围内。困扰你的并非事件本身，而是你对事件的判断。\n\n> \"如果你因任何外部事物而感到痛苦，困扰你的并非事物本身，而是你对它的判断。而这个判断，你有能力随时消除。\"\n>\n> (Marcus Aurelius, *Meditations*, 8.47)\n\n> \"从你的意见中消除'我被伤害了'这一判断，伤害本身就消失了。\"\n>\n> (Marcus Aurelius, *Meditations*, 4.3)\n\n马可·奥勒留的《沉思录》展示了斯多葛哲学的实践面向。它并非抽象的哲学论证，而是具体的精神训练，通过日常的自我对话，将控制二分法内化为面对每一个外部事件的第一反应。\n\n#### 六、从赫拉克利特到斯多葛的衔接\n\n赫拉克利特的逻各斯是宇宙性的，万物皆流，但流变遵循内在的理性秩序。斯多葛学派继承了这一宇宙论框架，但将重心从\"理解宇宙的逻各斯\"转向\"在宇宙的逻各斯中如何生活\"。\n\n赫拉克利特说火\"在一定的分寸上燃烧，在一定的分寸上熄灭\"（Fragment B30）。斯多葛学派从中推导出：宇宙万物遵循因果链条，人作为宇宙的一部分，也在这个链条之中。人不能改变链条，但人可以选择面对链条的态度，接受它（符合自然的生活）或抗拒它（痛苦而徒劳的）。\n\n从宇宙论到伦理学的转向是深刻的。赫拉克利特的逻各斯解释了世界如何运作。斯多葛的控制二分法解释了人应当如何在运作的世界中安放自己的幸福。前者是理论哲学，后者是实践哲学。两者的连接点是：宇宙遵循理性秩序（赫拉克利特），人的理性是宇宙理性的一部分（斯多葛），因此人可以通过理性认识到哪些在控制之内、哪些不在控制之内，并据此安排自己的生活。\n\n#### 七、类比：训练中的可控与不可控变量\n\n斯多葛的控制二分法在训练实践中有直接的映射。\n\n可控变量（ta eph' hēmin）：训练动作的选择、负荷的大小、组数和次数、训练频率、休息时间、呼吸模式、注意力的指向、每一次动作的速度控制。这些属于教练和客户直接掌控的范畴。\n\n不可控变量（ta ouk eph' hēmin）：遗传潜力（最大力量上限、肌纤维类型比例）、伤病史（已有的结构性损伤）、年龄（不可逆的时间进程）、激素基线水平（受遗传和年龄影响的部分）、外部环境（训练场地的设备条件、客户的工作压力和生活事件）。\n\n将训练目标设定在不可控变量上的后果与斯多葛描述的完全一致：挫折和焦虑。\"我必须在三个月内深蹲达到两倍体重\"，这个目标部分取决于遗传潜力和恢复能力，这些不完全在控制范围内。如果目标未达成，客户将痛苦归因于自身\"不够努力\"，而实际上可能是目标设定在不可控变量上。\n\n斯多葛式的训练思维是：将注意力完全集中在可控变量上，每一次训练的动作质量、负荷执行、恢复策略。这些变量在你的控制范围内。将它们做到位，结果自然会来，但\"结果具体是多少\"不在你的控制范围内。\n\n类比的边界差异在于：斯多葛的控制二分法是严格的，外在事物完全不可控，内在判断完全可控。训练实践中存在大量灰色地带：遗传潜力虽然不可控，但训练可以影响基因表达（表观遗传学，epigenetics）；伤病史不可控，但康复训练可以改善功能。训练中的\"可控-不可控\"是程度性的，而非二分性的。\n\n#### 八、对教练思维的含义\n\n斯多葛的控制二分法对教练思维有两条核心指导。\n\n第一，教练的专业能力范围在于可控变量。教练不能改变客户的遗传潜力，不能逆转客户的年龄，不能消除客户的生活压力。教练能做的是：在可控变量上做出最优决策，动作选择、负荷管理、进度安排、损伤预防。将注意力集中在可控变量上的教练是有效的，因为他/她在自己有能力产生影响的领域中工作。将焦虑投射到不可控变量上的教练是无效的，因为焦虑不会改变不可控的事物，只会干扰可控变量的决策质量。\n\n第二，帮助客户建立正确的归因框架。客户倾向于将结果（力量增长、体型变化）归因于不可控因素，\"我基因不好\"\"我恢复能力差\"。斯多葛式的教练将客户的注意力从不可控的结果转向可控的过程：你的训练执行度如何？营养摄入是否达标？睡眠质量是否改善？这些在你控制范围内的变量做到了多少？当客户学会将自我评价建立在可控的过程变量上，而非不可控的结果变量上时，训练焦虑和过早放弃的概率都会降低。\n\n---\n\n## 板块三：营养学\n\n### 丙酮酸的命运：有氧与无氧的代谢分叉\n\n**教材**：Loeffelholz, D. von, & Lefavi, R. G.,《健身营养全书》, 第2章\n\n---\n\n#### 一、糖酵解的终点：丙酮酸的产生\n\nLesson 9讨论了碳水化合物的消化吸收过程，最终葡萄糖通过血液运输到达骨骼肌细胞。在肌细胞的胞质中，葡萄糖经过糖酵解（glycolysis）途径被裂解。糖酵解的总反应式为：\n\n葡萄糖 + 2ADP + 2Pi + 2NAD⁺ → 2丙酮酸 + 2ATP + 2NADH + 2H⁺ + 2H₂O\n\n糖酵解的净产出是：每分子葡萄糖产生2分子丙酮酸（pyruvate）、2分子ATP（底物水平磷酸化）和2分子NADH。这一过程不需要氧气，在胞质中完成，是所有细胞葡萄糖代谢的共同起始路径。\n\n丙酮酸是糖酵解的终产物，但它本身不是代谢终点。丙酮酸的命运取决于细胞的氧气供应状态，即线粒体的有氧氧化能力是否能够满足当前的能量需求。这一分叉构成了有氧代谢与无氧代谢的分界线。\n\n#### 二、有氧条件下：丙酮酸的线粒体氧化\n\n当细胞的氧气供应充足（如静息状态或低强度运动中），丙酮酸进入线粒体（mitochondrion）进行有氧氧化（aerobic oxidation）。这一过程分为三个阶段。\n\n**第一阶段：丙酮酸进入线粒体。** 丙酮酸首先通过线粒体外膜上的电压依赖性阴离子通道（voltage-dependent anion channel, VDAC）进入线粒体膜间隙（intermembrane space）。VDAC是一个非选择性的大孔道，允许分子量小于5kDa的小分子自由通过。随后，丙酮酸通过线粒体内膜上的丙酮酸转运体（mitochondrial pyruvate carrier, MPC）被主动转运入线粒体基质（matrix）。MPC是一个质子共转运体（proton-coupled transporter），利用线粒体内膜两侧的质子电化学梯度（proton-motive force）将丙酮酸与H⁺共转运入基质。\n\n**第二阶段：丙酮酸脱氢酶复合体（PDH）催化氧化脱羧。** 在线粒体基质中，丙酮酸脱氢酶复合体（pyruvate dehydrogenase complex, PDH）催化丙酮酸的氧化脱羧反应：\n\n丙酮酸 + CoA-SH + NAD⁺ → 乙酰CoA + CO₂ + NADH + H⁺\n\n这一反应是糖代谢与TCA循环之间的关键连接步骤，丙酮酸被脱羧（释放CO₂）并氧化（NAD⁺被还原为NADH），同时与辅酶A（CoA-SH）结合形成乙酰辅酶A（acetyl-CoA）。\n\nPDH复合体是一个巨大的多酶复合体，由三种酶按精确的化学计量比组成：\n\nE1（丙酮酸脱羧酶，pyruvate decarboxylase）：以硫胺素焦磷酸（thiamine pyrophosphate, TPP）为辅基，催化丙酮酸的脱羧反应，释放CO₂。E1是整个复合体的催化起始位点。\n\nE2（二氢硫辛酰胺转乙酰酶，dihydrolipoyl transacetylase）：以硫辛酰胺（lipoamide）为辅基，通过其柔性长臂在E1和E3之间摆动，将乙酰基从E1转移至CoA-SH，形成乙酰CoA。E2构成复合体的核心结构。\n\nE3（二氢硫辛酰胺脱氢酶，dihydrolipoyl dehydrogenase）：以FAD和NAD⁺为辅因子，将E2上被还原的二氢硫辛酰胺重新氧化为硫辛酰胺，同时将电子传递给NAD⁺，生成NADH。\n\n三种酶的协同工作使丙酮酸的氧化脱羧在一个复合体内完成，中间产物不需要扩散到溶液中，乙酰基通过E2的硫辛酰胺柔性臂在活性位点之间直接传递。这种\"摆动臂\"（swinging arm）机制极大提高了催化效率。\n\n#### 三、PDH复合体的调控：代谢的关键开关\n\nPDH复合体的活性受到严格的调控，是糖代谢进入有氧氧化路径的关键开关。调控主要通过磷酸化-去磷酸化机制实现。\n\n丙酮酸脱氢酶激酶（pyruvate dehydrogenase kinase, PDK）催化PDH E1亚基的磷酸化，使其失活。丙酮酸脱氢酶磷酸酶（pyruvate dehydrogenase phosphatase, PDP）催化去磷酸化，使其重新激活。\n\nPDK的活性受产物浓度调控。当线粒体基质中乙酰CoA和NADH浓度升高时，意味着细胞的能量状态充足，不需要更多的有氧氧化，PDK被激活，PDH被磷酸化失活，丙酮酸的有氧氧化通路被关闭。这是一种产物抑制（product inhibition）机制：当终产物积累时，抑制通向终产物的路径。\n\nPDP的活性受Ca²⁺浓度调控。在骨骼肌收缩时，肌浆网（sarcoplasmic reticulum）释放Ca²⁺触发肌肉收缩，同时胞质和线粒体基质中的Ca²⁺浓度升高。Ca²⁺直接激活PDP，使PDH去磷酸化激活，加速丙酮酸的有氧氧化。这一调控机制的生理学意义明确：肌肉收缩同时触发能量需求和能量供应，Ca²⁺既是收缩的信号，也是有氧代谢加速的信号。\n\n> \"丙酮酸脱氢酶复合体是糖有氧氧化的关键调控点，通过磷酸化失活和去磷酸化激活来响应细胞的能量状态。\"\n>\n> (Loeffelholz & Lefavi,《健身营养全书》第2章)\n\n#### 四、乙酰CoA进入TCA循环\n\nPDH催化产生的乙酰CoA进入三羧酸循环（tricarboxylic acid cycle, TCA cycle），也称柠檬酸循环（citric acid cycle）或Krebs循环。\n\n乙酰CoA与草酰乙酸（oxaloacetate）在柠檬酸合酶（citrate synthase）催化下缩合，生成柠檬酸（citrate）并释放CoA-SH。此后经过8步酶促反应，柠檬酸被逐步氧化脱羧，最终重新生成草酰乙酸，完成一轮循环。每轮TCA循环的净产出为：\n\n1乙酰CoA → 2CO₂ + 3NADH + 1FADH₂ + 1GTP（等价于1ATP）\n\n由于每分子葡萄糖经过糖酵解产生2分子丙酮酸，每分子丙酮酸经PDH产生1分子乙酰CoA，因此每分子葡萄糖进入TCA循环后产生的总量为：4CO₂ + 6NADH + 2FADH₂ + 2GTP。\n\n加上糖酵解阶段产生的2NADH，每分子葡萄糖完全氧化到CO₂和H₂O时，总共产生约10NADH和2FADH₂。这些还原当量（reducing equivalents）随后进入电子传递链（electron transport chain, ETC）。\n\n#### 五、电子传递链与氧化磷酸化\n\n电子传递链位于线粒体内膜上，由四个蛋白复合体组成。NADH将电子传递给复合体I（NADH-泛醌氧化还原酶），电子经泛醌（CoQ/ubiquinone）传递至复合体III（细胞色素bc₁复合体），再经细胞色素c（cytochrome c）传递至复合体IV（细胞色素c氧化酶），最终传递给分子氧（O₂），生成水（H₂O）。\n\nFADH₂从复合体II（琥珀酸脱氢酶）进入电子传递链，这也是TCA循环中的一个组分。由于FADH₂进入的位点低于NADH（复合体II vs 复合体I），它不经过复合体的质子泵，因此产生的ATP少于NADH。\n\n电子在复合体间传递的过程中释放的能量被用于将H⁺从线粒体基质泵入膜间隙，建立跨内膜的质子电化学梯度（proton electrochemical gradient）。这一梯度驱动ATP合酶（ATP synthase, 复合体V）合成ATP，H⁺顺梯度回流通过ATP合酶，驱动ADP + Pi → ATP。这一过程称为化学渗透偶联（chemiosmotic coupling），由Peter Mitchell于1961年提出。\n\n每分子NADH通过电子传递链和ATP合酶大约产生2.5分子ATP，每分子FADH₂大约产生1.5分子ATP。综合计算，每分子葡萄糖完全氧化产生的ATP总量约为30-32分子（包括糖酵解的2ATP、TCA循环的2GTP，以及电子传递链的约26-28ATP）。具体的数值因NADH从胞质进入线粒体的穿梭机制不同而有所差异（苹果酸-天冬氨酸穿梭 vs 甘油-3-磷酸穿梭）。\n\n#### 六、无氧条件下：乳酸发酵\n\n当细胞的氧气供应不足（如高强度运动中），线粒体的有氧氧化能力无法满足能量需求，丙酮酸不能进入线粒体被充分氧化。此时，丙酮酸在胞质中的代谢走向另一条路径。\n\n乳酸脱氢酶（lactate dehydrogenase, LDH）催化丙酮酸接受NADH提供的氢原子，还原为乳酸（lactate），同时NADH被氧化为NAD⁺：\n\n丙酮酸 + NADH + H⁺ → 乳酸 + NAD⁺\n\n这一反应的关键生理学意义在于再生NAD⁺。糖酵解需要NAD⁺作为底物（甘油醛-3-磷酸脱氢酶步骤）。如果NAD⁺不能被再生，糖酵解将因NAD⁺耗竭而停止。乳酸发酵的本质目的并非产生乳酸，而是在无氧条件下再生NAD⁺以维持糖酵解的持续运行。\n\n#### 七、LDH同工酶与组织特异性\n\n乳酸脱氢酶是由两种亚基（H亚基和M亚基）组成的四聚体，形成五种同工酶（isoenzyme）：LDH-1（H₄）、LDH-2（H₃M₁）、LDH-3（H₂M₂）、LDH-4（H₁M₃）、LDH-5（M₄）。\n\n不同同工酶在不同组织中占优势，且具有不同的催化特性。LDH-1（H₄，四个H亚基）在心肌和氧化型肌纤维中占优势，其对乳酸的Km值较低，偏好催化乳酸→丙酮酸方向的反应，即将乳酸氧化为丙酮酸进入有氧代谢。LDH-5（M₄，四个M亚基）在骨骼肌（尤其是快缩/糖酵解型肌纤维）和肝脏中占优势，其对丙酮酸的Km值较低，偏好催化丙酮酸→乳酸方向的反应，即在无氧条件下快速再生NAD⁺。\n\n这种同工酶分布的生理学意义在于：骨骼肌在高强度运动中产生乳酸，乳酸通过血液运输到心肌和氧化型肌纤维后被LDH-1重新转化为丙酮酸进入有氧氧化，实现了乳酸的再利用。\n\n#### 八、乳酸的去路：Cori循环与氧化利用\n\n乳酸曾长期被视为代谢废物。当代运动生理学将乳酸重新定位为重要的代谢中间物和能量底物。乳酸的主要去路有三条。\n\n第一，MCT1转运至氧化型肌纤维和心肌进行氧化。单羧酸转运体1（monocarboxylate transporter 1, MCT1）将乳酸从产生乳酸的快缩肌纤维中转运至血液，再转运至氧化型（慢缩）肌纤维和心肌。在这些组织中，LDH-1将乳酸重新转化为丙酮酸，丙酮酸进入线粒体经PDH和TCA循环完全氧化供能。在高强度运动中，乳酸是心肌的重要能量底物。\n\n第二，MCT1转运至肝脏进行糖异生（Cori循环）。乳酸经血液运输至肝脏，在肝细胞中经LDH转化为丙酮酸，丙酮酸经糖异生途径（gluconeogenesis）重新合成葡萄糖。葡萄糖释放入血后可被骨骼肌再次利用。Cori循环的净能量消耗为6ATP（将2分子乳酸重新合成为1分子葡萄糖），而糖酵解净产出仅2ATP。这意味着Cori循环是一个净消耗能量的循环，其生理学意义在于维持血糖稳定和回收碳骨架，而非能量效率。\n\n第三，少量乳酸随尿液和汗液排出。\n\n乳酸阈值（lactate threshold, LT）是指运动强度增加到某一水平时，血乳酸浓度出现急剧上升的转折点。最大乳酸稳态（maximal lactate steady state, MLSS）是指乳酸产生速率与清除速率达到动态平衡时的最高运动强度。这两个指标是评估有氧代谢能力和制定训练强度的重要参考。\n\n#### 九、类比：代谢分叉如同城市交通的分流系统\n\n丙酮酸的有氧-无氧代谢分叉与城市交通的分流系统存在结构上的对应。\n\n葡萄糖通过糖酵解被裂解为丙酮酸，如同城市主干道上的车辆到达一个分叉路口。路口的分流规则取决于\"交通容量\"，即线粒体的有氧氧化能力。当交通容量充足（有氧条件），车辆（丙酮酸）进入高速公路（线粒体氧化路径），高效到达目的地（大量ATP产出）。当交通容量不足（无氧条件），高速公路拥堵，车辆被迫转向辅路（乳酸发酵路径），效率较低但能维持交通流不中断。\n\nCori循环类似于城市的物流回收系统。辅路上产生的废物（乳酸）被运输到专门的回收站（肝脏），经过处理重新变成可用资源（葡萄糖），再送回主干道使用。回收过程需要消耗额外的能量（6ATP），但维持了资源循环的持续性。\n\n类比的边界差异在于：交通分流是被动的，车辆自动选择空闲路径。丙酮酸的代谢分叉是受调控的，PDH复合体的磷酸化状态、Ca²⁺浓度、产物反馈等多种调控机制精确控制着丙酮酸进入有氧路径的比例。代谢分叉的调控比交通分流复杂得多。\n\n#### 十、对教练思维的含义\n\n丙酮酸代谢分叉的知识对教练实践有三个层面的意义。\n\n第一，理解训练强度的代谢基础。低强度运动时，丙酮酸主要进入线粒体有氧氧化，脂肪也同时被大量氧化供能。随着运动强度增加，糖酵解速率加快，丙酮酸产生速率超过线粒体氧化能力，越来越多的丙酮酸转向乳酸发酵。乳酸阈值是有氧代谢向无氧代谢转变的临界点。教练在制定训练方案时，需要理解不同强度区间对应的代谢路径：有氧区间（低于乳酸阈值）主要依赖有氧氧化，无氧区间（高于乳酸阈值）越来越多依赖糖酵解和乳酸发酵。\n\n第二，理解乳酸不是废物。乳酸是糖酵解在无氧条件下维持运行的必要产物，它再生NAD⁺使糖酵解得以持续。乳酸本身可以被心肌和氧化型肌纤维重新氧化供能，也可以经Cori循环在肝脏中回收为葡萄糖。训练中乳酸的积累说明乳酸产生速率超过清除速率，不表明\"乳酸有害\"。\n\n第三，理解训练适应的代谢机制。长期的有氧训练提高线粒体密度和PDH活性，使丙酮酸在更高强度下仍能进入有氧路径，乳酸阈值向更高强度移动。长期的高强度间歇训练提高LDH和糖酵解酶的活性，使无氧供能能力增强。教练在设计训练方案时，需要明确训练目标是提升有氧能力（提高乳酸阈值）还是增强无氧能力（提高糖酵解功率），两者对应的训练强度和容量策略不同。\n\n---\n\n## 板块四：生物力学\n\n### 自由体图与深蹲的逆动力学分析\n\n**教材**：McGinnis, P. M., *Biomechanics of Sport and Exercise*, 3rd ed., Chapter 4\n\n---\n\n#### 一、自由体图的定义与绘制步骤\n\n自由体图（free body diagram, FBD）是力学分析的基本工具。其定义是：将研究对象从周围环境中隔离出来，单独绘制该对象，并在其上标注所有作用在该对象上的外力和力矩。\n\n自由体图的核心思想是\"隔离\"，将研究对象从复杂的力学环境中提取出来，只关注作用在它上面的力和力矩。这一思想在概念上与Lesson 9讨论的关节接触面积分析存在逻辑递进：Lesson 9关注的是关节面内部的应力分布，本课关注的是整个肢体段在多个外力作用下的力矩平衡。\n\n绘制自由体图的步骤如下。\n\n第一步：确定研究对象。选择一个刚体或刚体系统作为分析对象。在人体运动分析中，研究对象通常是一个肢体段（如小腿、大腿、躯干）或整个身体。\n\n第二步：画出隔离体。将研究对象从周围环境中隔离出来，单独绘制其轮廓。移除所有与环境的连接，代之以相应的外力。\n\n第三步：标注所有外力。包括：重力W（作用于质心，方向竖直向下）；地面反作用力（ground reaction force, GRF，作用于足底接触面，方向通常有竖直分量和水平分量）；关节反作用力（joint reaction force, JRF，作用于关节中心，方向和大小待求）；肌肉力（muscle force，作用于肌肉附着点，方向沿肌腱走行）。\n\n第四步：建立坐标系。通常取水平方向为x轴，竖直方向为y轴。\n\n第五步：列出平衡方程。对于静力分析（物体处于平衡状态），三个平衡方程为：\n\nΣFx = 0（水平方向力的代数和为零）\nΣFy = 0（竖直方向力的代数和为零）\nΣM = 0（对任意点的力矩代数和为零）\n\nMcGinnis指出：\n\n> \"自由体图是将研究对象从环境中隔离出来，标注所有作用在其上的外力和力矩。它是力学分析的第一步，也是最关键的一步。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n#### 二、逆动力学方法论\n\n在人体运动力学分析中，有两种基本方法。正动力学（forward dynamics）：已知肌肉力，求解运动结果。逆动力学（inverse dynamics）：已知运动结果（关节角度、角加速度等）和外力（如地面反作用力），从远端向近端逐关节求解关节力矩和关节反作用力。\n\n逆动力学是运动生物力学中最常用的方法，因为运动学和地面反作用力可以通过运动捕捉系统和测力台直接测量，而肌肉力无法在活体中直接测量。\n\n逆动力学的计算顺序是从远端（distal）向近端（proximal）逐关节推进。以深蹲为例：首先以足部为研究对象，利用已知的地面反作用力（由测力台测量）和足部的重力，求解踝关节的关节反作用力和力矩。然后以小腿为研究对象，利用已求得的踝关节反作用力（牛顿第三定律：作用力与反作用力大小相等、方向相反），结合小腿的重力，求解膝关节的关节反作用力和力矩。以此类推，逐关节向近端推进至髋关节和腰椎。\n\n逆动力学的关键假设是：每个关节被简化为一个铰链关节（hinge joint），关节力矩被简化为一个纯力矩（pure moment），不考虑关节面的接触力学和韧带的被动约束力。这一简化在大多数运动分析中是可接受的，但在分析关节损伤机制时需要更精细的模型。\n\n#### 三、深蹲中踝关节的力矩分析\n\n以深蹲的下降阶段（eccentric phase）为例。将足部作为隔离体，标注作用在其上的外力。\n\n竖直方向：地面反作用力的竖直分量（GRFy，向上）；足部重力（Wfoot，向下）；踝关节反作用力的竖直分量（JRFy，方向待求）。\n\n水平方向：地面反作用力的水平分量（GRFx，通常向前或向后）；踝关节反作用力的水平分量（JRFx，方向待求）。\n\n力矩分析：取踝关节中心为力矩计算的参考点。地面反作用力对踝关节中心产生一个力矩，力矩的大小等于GRF与力臂（从踝关节中心到GRF作用线的垂直距离）的乘积。GRF的作用线通常经过足底压力中心（center of pressure, COP），COP相对于踝关节中心的位置决定了力臂的长度和方向。\n\n在深蹲下降阶段，身体重心向后下方移动，GRF的作用线通常位于踝关节中心的前方。GRFy（向上）对踝关节中心产生一个使踝关节背屈（dorsiflexion）的力矩。为了对抗这一外力矩并控制下降速度，跖屈肌群（腓肠肌 gastrocnemius 和比目鱼肌 soleus）必须产生一个等大的跖屈（plantar flexion）内力矩。\n\n> \"在深蹲中，地面反作用力对踝关节的力矩由跖屈肌群的收缩力矩来平衡。随着下蹲深度增加，GRF对踝关节的力臂增大，跖屈肌群需要产生更大的力矩。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n#### 四、深蹲中膝关节的力矩分析\n\n以小腿（shank segment）为隔离体。作用在小腿上的外力包括：小腿重力Wshank（作用于小腿质心，向下）；踝关节反作用力（从踝关节分析中求得，作用于踝关节中心）；膝关节反作用力（待求，作用于膝关节中心）。\n\n力矩分析取膝关节中心为参考点。在深蹲下降阶段，膝关节屈曲角度增大。GRF通过小腿传递，对膝关节中心产生一个屈曲力矩（flexion moment），这个力矩倾向于使膝关节继续屈曲。\n\n为了控制下降速度（而非自由下落），股四头肌（quadriceps femoris）必须产生一个伸展力矩（extension moment）来对抗膝关节屈曲力矩。股四头肌通过髌腱（patellar tendon）在胫骨粗隆（tibial tuberosity）处施加拉力，对膝关节中心产生伸展力矩。力臂为从膝关节中心到髌腱拉力线的垂直距离。\n\n随着下蹲深度增加，膝关节屈曲角度增大，GRF对膝关节的力臂增大，膝关节屈曲力矩增大。股四头肌需要产生更大的伸展力矩来对抗。这就是为什么深蹲在最低点附近感觉最困难，膝关节屈曲力矩在该区域达到峰值。\n\n#### 五、深蹲中髋关节的力矩分析\n\n以大腿（thigh segment）为隔离体。作用在大腿上的外力包括：大腿重力Wthigh（作用于大腿质心，向下）；膝关节反作用力（从膝关节分析中求得）；髋关节反作用力（待求，作用于髋关节中心）。\n\n力矩分析取髋关节中心为参考点。在深蹲下降阶段，躯干前倾角度增大。GRF通过小腿和大腿传递，对髋关节中心产生一个屈曲力矩（flexion moment）。躯干的前倾使身体重心相对于髋关节中心的水平距离增大，进一步增加了屈曲力矩。\n\n臀大肌（gluteus maximus）和腘绳肌（hamstrings）必须产生一个伸展力矩（extension moment）来对抗髋关节屈曲力矩。臀大肌通过其在股骨和髂胫束上的附着点施加拉力，对髋关节产生伸展力矩。\n\n躯干前倾角度对髋关节力矩有直接影响。躯干越前倾，身体重心相对于髋关节的水平距离越大，髋关节屈曲力矩越大，臀大肌和腘绳肌需要产生更大的伸展力矩。\n\n#### 六、不同深度的力学差异\n\n深蹲的深度，半蹲（partial squat, 膝关节屈曲约45-60°）、平行蹲（parallel squat, 大腿与地面平行，膝关节屈曲约90°）、全蹲（full squat, 膝关节屈曲超过120°），直接影响各关节的力矩大小和分配。\n\n膝关节力矩随屈曲角度增加而增大。在半蹲范围内（0-60°），膝关节力矩随屈曲角度增加而增大；在60-90°范围内继续增大；在超过90°后，由于胫骨后方的软组织接触（股骨髁与胫骨后方的软组织挤压），膝关节力矩可能不再继续增加或略有下降。\n\n髋关节力矩受躯干倾斜角度的影响显著。高杠深蹲中躯干相对直立，髋关节屈曲力矩相对较小，膝关节屈曲力矩较大。低杠深蹲中躯干前倾角度更大，髋关节屈曲力矩增大，膝关节屈曲力矩相对减小。这意味着不同杠铃位置的深蹲对肌群的需求存在差异：高杠深蹲对股四头肌的要求更高，低杠深蹲对臀大肌和腘绳肌的要求更高。\n\n> \"杠铃位置通过改变躯干倾斜角度来改变髋关节和膝关节之间的力矩分配，进而改变对不同肌群的需求。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n#### 七、高杠与低杠的力学比较\n\n高杠（high bar）深蹲中，杠铃放置于斜方肌上部（C7-T1椎体水平）。这一位置使躯干在深蹲过程中保持相对直立，身体重心相对于髋关节中心的水平距离较短。结果是：髋关节屈曲力矩较小，膝关节屈曲力矩较大。肌肉需求偏向股四头肌主导。\n\n低杠（low bar）深蹲中，杠铃放置于三角肌后束和菱形肌之间（约T3-T7椎体水平）。杠铃位置的后移使身体为了维持整体重心在足底中心上方，躯干必须更大幅度前倾。结果是：髋关节屈曲力矩增大（躯干前倾角度增大），膝关节屈曲力矩相对减小。肌肉需求偏向臀大肌和腘绳肌主导。\n\n两种深蹲方式的总负荷可以不同。低杠深蹲由于躯干前倾使髋关节伸展肌群（臀大肌和腘绳肌）在更有利的力学位置工作，多数训练者可以使用更大的负荷。高杠深蹲对膝关节的力矩要求更高，在膝关节康复或股四头肌强化训练场景中可能是更合适的选择。\n\n#### 八、类比：起重机的多关节力矩分析\n\n深蹲的逆动力学分析与起重机（crane）的多关节力矩分析存在结构上的对应。\n\n起重机的悬臂由多段组成，每段之间通过铰链连接。每一段悬臂承受自身重力、负载重力以及铰链处的反作用力和力矩。工程师在设计起重机时，需要从最远端（吊钩处）开始，逐段向基座方向计算每一段铰链处的力和力矩，这与逆动力学从远端向近端逐关节求解的方法论完全一致。\n\n深蹲中的下肢类似一个多段铰链结构：足部-小腿-大腿-躯干，各段之间通过踝关节、膝关节、髋关节连接。地面反作用力相当于起重机基座的支撑力，杠铃重力相当于负载重力。逆动力学分析从足部（最远端）开始，利用已知的GRF求解踝关节力矩，然后逐关节向髋关节推进。\n\n类比的精确之处在于：两者都是多段铰链结构的力学分析，都从已知外力出发由远端向近端逐段求解，都涉及各段重力和外部负荷对关节/铰链的力矩计算。\n\n类比的边界差异在于：起重机的悬臂段是刚性杆件，关节是被动铰链。人体的肢体段是活体组织，关节是主动力矩发生器（肌肉跨越关节产生力矩）。起重机的铰链只传递力和力矩，人体的关节除了传递力和力矩外，还主动产生力矩来控制运动。\n\n#### 九、对教练思维的含义\n\n自由体图和逆动力学分析对教练实践有两条核心指导。\n\n第一，理解深蹲中\"卡点\"的力学来源。客户在深蹲中感觉最困难的位置通常对应着力矩峰值。膝关节在接近90°屈曲时力矩最大（股四头肌需求最高）。髋关节在躯干最前倾时力矩最大（臀大肌需求最高）。如果客户的\"卡点\"出现在某个特定深度，教练可以通过力矩分析判断是哪些肌群的力学需求超出了当前能力，然后有针对性地强化这些肌群或调整技术策略（如改变杠铃位置、站距或脚位角度）来改变力矩分配。\n\n第二，杠铃位置的选择是力学决策而非偏好问题。高杠和低杠的区别不仅是\"习惯不同\"，而是系统性地改变了各关节的力矩分配。股四头肌相对薄弱或有膝关节问题的客户可能更适合高杠深蹲（膝关节力矩更可控）。臀大肌和腘绳肌相对薄弱或有下背问题的客户可能需要先强化后链肌肉后再尝试低杠深蹲。杠铃位置的选择应当基于力学分析，而非传统或个人偏好。\n\n---\n\n## 板块五：解剖\n\n### 三角肌三束：结构与功能分化\n\n**教材**：Neumann, D. A., *Kinesiology of the Musculoskeletal System*, 3rd ed., Chapter 5；《功能解剖》, Chapter 4\n\n---\n\n#### 一、三角肌的整体结构\n\n三角肌（deltoid muscle）是覆盖肩关节外侧的大而表浅的多羽肌（multipennate muscle），形成肩部的圆形轮廓。三角肌的名称来源于其大致呈三角形（delta, δ）的外观。\n\n三角肌的整体结构由三个功能上可区分的肌束（fiber bundles）组成：前束（anterior/clavicular fibers）、中束（middle/acromial fibers）和后束（posterior/scapular spine fibers）。三个肌束各自拥有独立的神经支配分支，腋神经（axillary nerve）的前支和后支分别支配不同肌束。三束的肌纤维最终汇聚于共同的止点。\n\n三角肌是肩关节最强大的运动肌，其产生的力矩远超肩袖肌群。在肩关节外展动作中，三角肌（尤其在中束）提供了主要的动力来源。但三角肌的大力量带来了一个力学问题，它的收缩力有一个将肱骨头向上方推移的分量。这一向上分量需要肩袖（尤其冈上肌）的向下压分量来平衡。三角肌与肩袖的关系是\"大力量-需稳定\"的配对，三角肌提供运动动力，肩袖提供稳定平台。\n\nLesson 9建立了肩关节复合体的整体框架，四关节协同、肩肱节律、肩袖的中心化压缩功能。本课聚焦于三角肌三束的解剖结构和功能分化，是肩关节复合体从整体框架到具体肌肉的深入。\n\n#### 二、前束（anterior/clavicular fibers）\n\n前束起自锁骨外侧三分之一的前面（anterior surface of lateral third of clavicle）。肌纤维从前上方向后下方走行，止于三角肌粗隆（deltoid tuberosity）的前上部。\n\n前束的力线方向是前上方至后下方，与肌纤维的走行方向一致。这一力线方向决定了前束的功能：\n\n肩关节屈曲（flexion）：前束是肩关节屈曲的主要动力来源之一，尤其在前屈0-90°范围内。在前屈起始阶段（0-30°），前束的力线与肱骨纵轴近乎垂直，力臂最大，屈曲力矩效率最高。随着前屈角度增大（超过90°），前束的力线逐渐与肱骨纵轴趋于平行，力臂减小，屈曲效率下降。\n\n水平内收（horizontal adduction）：当肩关节外展至90°时，前束的收缩使上臂在水平面上向身体中线方向移动。\n\n内旋（internal rotation）：前束的力线经过肩关节屈曲-内旋轴的前方，因此在前屈位置上有内旋分量。\n\n前束的神经支配来自腋神经的前支。前束的肌纤维类型以II型（快缩）纤维为主，适合产生爆发性力量。\n\n#### 三、中束（middle/acromial fibers）\n\n中束起自肩峰（acromion）的外侧面。肌纤维从外侧方向垂直下行，止于三角肌粗隆的中部。\n\n中束的力线方向是纯外侧（lateral）。这一力线方向使中束成为肩关节外展的最主要动力来源。\n\n肩关节外展（abduction）：中束在外展15-90°范围内贡献最大。在外展起始阶段（0-15°），冈上肌是外展的主要启动肌。超过15°后，三角肌中束逐步成为外展的主导力量。在外展90°时，中束的力线与肱骨纵轴近乎垂直，力臂最大。超过90°后（继续向上举过头顶），中束的力臂开始减小，需要肩胛骨的上回旋（scapular upward rotation）来维持有效力臂。\n\n中束的多羽肌结构使其在有限体积内容纳了大量肌纤维。多羽状排列（multipennate arrangement）使肌纤维以一定角度（羽角，pennation angle）附着于中央肌腱。羽角的存在使每单位肌肉横截面积可以容纳更多肌纤维，增大了生理横截面积（physiological cross-sectional area, PCSA），从而增大了肌肉的最大收缩力。代价是每一根肌纤维产生的力只有沿肌腱方向的分量被传递，力 = 肌纤维力 × cos(羽角)。但对于三角肌这样需要产生大力矩的大肌肉，多羽状排列的净效果是增加力量输出。\n\n#### 四、后束（posterior/scapular spine fibers）\n\n后束起自肩胛冈下唇（inferior lip of scapular spine）。肌纤维从后上方向前下方走行，止于三角肌粗隆的后上部。\n\n后束的力线方向是后上方至前下方。这一力线方向决定了后束的功能：\n\n肩关节伸展（extension）：后束使上臂在矢状面上向后运动。\n\n水平外展（horizontal abduction）：当肩关节外展至90°时，后束的收缩使上臂在水平面上远离身体中线。\n\n外旋（external rotation）：后束的力线经过肩关节旋转轴的后方，因此具有外旋力矩。\n\n后束的神经支配来自腋神经的后支。后束在日常生活中被使用的频率低于前束和中束，大多数日常动作（推、举、拿）主要涉及前束和中束。这种使用模式的不对称导致后束相对薄弱是常见的现象。\n\n#### 五、三束的协同与分化\n\n三角肌三束虽然共同止于三角肌粗隆，但它们的功能并非简单的叠加。三束在不同动作中选择性激活，而非总是同时以最大强度收缩。\n\n整体外展动作中，中束提供主要的外展力矩。但前束和后束并非完全沉默。前束在外展过程中有一个向上的力分量（将肱骨头向上方推移），后束有一个向下的力分量。两者在垂直方向上的分量部分相互抵消。中束的力线是纯外侧的，没有明显的上下分量。三束的协同使外展力矩最大化的同时，将不必要的上下平移分量降至最低。\n\n在肩关节屈曲动作中，前束为主导，中束和后束的激活程度较低。在肩关节伸展动作中，后束为主导。在需要精确控制肩关节位置的动作中（如投掷动作的减速阶段），三束的协调收缩提供精细的位置控制。\n\n> \"三角肌三束在不同肩关节动作中表现出差异化的激活模式，体现了肌束功能分化的神经控制策略。\"\n>\n> (Neumann, *Kinesiology of the Musculoskeletal System*, 3rd ed., Ch5)\n\n#### 六、三角肌与肩袖的力学关系\n\n三角肌与肩袖的关系是肩关节力学中最关键的交互之一。这一关系在Lesson 9中已作为肩袖的中心化压缩功能进行了讨论，此处从三角肌一侧进一步展开。\n\n三角肌（尤其是中束和前束）收缩时，其力线通过肩关节旋转轴的上方。这意味着三角肌的收缩不仅产生外展或屈曲的旋转力矩（有用的分量），还产生一个将肱骨头向上方平移的力分量（有害的分量）。如果没有对抗力，肱骨头将在三角肌的牵拉下向上方平移，撞击肩峰下结构（冈上肌腱、肩峰下滑囊），导致肩峰下撞击。\n\n肩袖（尤其是冈上肌）的作用就是提供这个对抗力。冈上肌的力线通过肩关节旋转轴的下方，其收缩产生一个将肱骨头向下方压入关节盂的力分量。这一向下的压分量与三角肌向上的拉分量形成力偶（force couple），使肱骨头在肩关节运动中保持在关节盂的中心位置。\n\n三角肌越强大（力量输出越高），肩袖需要提供的向下压分量也越大。如果肩袖力量不足，不能匹配三角肌的向上拉力，肱骨头在每次三角肌强力收缩时都会向上方平移，肩峰下间隙被压缩。这就是为什么三角肌是肩关节运动的主力，而肩袖是肩关节安全的基础。两者必须匹配，三角肌的力量增长需要伴随肩袖的同步强化。\n\n#### 七、三角肌粗隆处的肌腱融合模式\n\n三角肌三束的肌纤维最终汇聚于三角肌粗隆（deltoid tuberosity），位于肱骨干的外侧面中段。三束的肌腱在到达三角肌粗隆之前形成一个融合的腱性结构。\n\n三束的肌腱融合模式具有一定的解剖学变异。在多数个体中，前束和后束的肌腱在深层交叉融合，中束的肌腱在浅层覆盖。这种融合模式使三束的收缩力可以在一定程度上相互传递，当前束单独收缩时，部分力可以通过腱性融合传递至中束和后束的止点区域。\n\n肌腱融合的生理意义在于：它使三角肌在产生大幅度运动时，即使某一束的激活不完全，其他束的收缩仍然可以通过腱性融合部分补偿力的传递。这种\"力的共享\"机制增加了三角肌功能的冗余度（redundancy）。\n\n三角肌粗隆区域的血供相对较差，这是三角肌腱病变（deltoid tendinopathy）少见但一旦发生较难愈合的原因之一。\n\n#### 八、训练应用：三束的差异化训练\n\n三角肌三束的功能分化意味着训练方案需要针对每一束进行差异化设计，而非仅依靠复合动作来\"整体训练\"三角肌。\n\n前束训练：前平举（anterior raise），肩关节在矢状面上从伸展位前屈至90°，前束是主要动力来源。上斜卧推（incline bench press），肩关节在前屈30-45°位做推举动作，前束在水平内收和屈曲中贡献主要力矩。推类动作（卧推、过头推举）中前束作为协同肌已经被大量激活。\n\n中束训练：侧平举（lateral raise），肩关节在外展平面（肩胛骨平面，scapular plane，约前方30-45°）上做外展动作，中束是主要动力来源。在肩胛骨平面做侧平举可以减少肩峰下撞击的风险，同时最大化中束的力矩贡献。直立划船（upright row），肩关节在外展位做肩胛骨上提，中束和上斜方肌协同参与。\n\n后束训练：俯身飞鸟（bent-over lateral raise），躯干前倾位做肩关节水平外展，后束是主要动力来源。面拉（face pull），使用绳索或弹力带做肩关节外旋加水平外展的复合动作，同时训练后束和肩袖的外旋肌群。\n\n三束训练不均衡的后果是肩部力学失衡。前束和/或中束过度发达而后束薄弱时，肩关节的静息位置可能受到肌力不对称的影响，前束的紧张使肩关节前倾，后束的薄弱不能有效对抗前束的前拉力。这种失衡可能加剧肩胛骨前倾和圆肩姿态，间接增加肩峰下撞击的风险。\n\n#### 九、类比：帆船的三面帆\n\n三角肌三束的功能分化与帆船的三面帆存在结构上的对应。\n\n帆船通常配备三面帆：主帆（mainsail）、前帆（jib/headsail）和尾帆（spinnaker或mizzen，取决于船型）。每面帆捕获不同方向的风力，三面帆的协同调整使船在不同风向下获得最优推进力。\n\n三角肌三束类似：前束如同前帆，主导前方方向的力（肩屈曲）；中束如同主帆，主导侧方方向的力（肩外展）；后束如同尾帆，主导后方方向的力（肩伸展和水平外展）。三面帆可以独立调整角度（如同三束的选择性激活），也可以协同工作以获得最大推进力（如同三束的协同收缩）。\n\n类比的精确之处在于：三面帆的独立调整使帆船在不同风向中都能获得有效推进力，正如三束的选择性激活使肩关节在不同方向上都能产生有效力矩。如果一面帆损坏或不能正常工作，帆船在该风向下将失去有效推进力，正如某一束的功能障碍导致特定方向上的力矩不足。\n\n边界差异：帆船的三面帆面积大致相当，力矩贡献相对均衡。三角肌三束的力量并不均衡，中束体积最大、力量最强，前束次之，后束通常最薄弱。这种力量不对称使后束更容易成为薄弱环节。\n\n#### 十、对教练思维的含义\n\n三角肌三束的解剖学知识对教练实践有三条核心指导。\n\n第一，肩部训练必须包含三束的差异化训练。仅靠过头推举（overhead press）训练\"三角肌\"是不够的，过头推举主要激活前束和中束，后束的参与有限。一个完整的肩部训练方案需要分别针对前束（推类动作）、中束（侧平举）和后束（俯身飞鸟/面拉）设计训练动作。\n\n第二，后束训练不可省略。后束在日常活动中被使用的频率最低，在大多数训练方案中被忽视的概率最高。后束薄弱导致肩关节前后肌力不平衡，增加肩胛骨前倾和圆肩姿态的风险。面拉（face pull）是一个高效的后束+肩袖外旋肌群联合训练动作，应当被纳入大多数训练方案。\n\n第三，三角肌-肩袖的力量匹配是肩部安全的关键。三角肌是肩关节最强大的运动肌，它的强力收缩对肩袖的中心化压缩功能提出了高要求。如果客户在持续增加三角肌训练负荷的同时忽视肩袖训练，三角肌与肩袖之间的力量差距将增大，肱骨头在三角肌强力收缩时的向上平移风险增加。三角肌的力量增长必须伴随肩袖的同步强化。\n\n---\n\n## 全课总结\n\n### 检验与控制的统一线索\n\n本课五个板块围绕\"检验与控制\"这一主题展开，呈现了一条从科学方法论到身体力学的完整线索。\n\n板块一中，波普尔的否证逻辑展示了科学理论的检验方法：提出大胆猜测，演绎出精确预测，用经验来尝试否证。否证的演绎结构（modus tollens）确保了检验的逻辑严格性。确证与否证的不对称性决定了科学进步的路径：通过积累证实无法抵达真理，通过消除错误逐步逼近真理。\n\n板块二中，斯多葛的控制二分法提出了实践智慧的检验标准：区分可控与不可控。将注意力集中在可控变量上（判断、态度、行为），接受不可控变量（身体、财产、名声）的变化。从赫拉克利特的宇宙论逻各斯到斯多葛的伦理实践，哲学完成了从\"理解世界\"到\"在世界中行动\"的转向。\n\n板块三中，丙酮酸的代谢分叉揭示了细胞层面的控制开关。PDH复合体是丙酮酸进入有氧氧化路径的调控节点，磷酸化失活、去磷酸化激活。Ca²⁺信号同时触发肌肉收缩和PDH激活，使能量供应与能量需求精确匹配。乳酸并非废物，而是无氧条件下维持糖酵解运行的必要产物，也是可以被回收再利用的代谢中间物。\n\n板块四中，自由体图和逆动力学分析提供了力学检验的工具。从已知外力出发，由远端向近端逐关节求解力矩，深蹲中每个关节的力矩大小和分配可以被精确量化。不同深度和杠铃位置通过改变力臂长度来改变力矩分配，进而改变对不同肌群的需求。\n\n板块五中，三角肌三束的解剖学知识使肩部训练的控制精度从\"练肩\"提升到\"练哪一束\"。前束、中束、后束的力线方向和功能分化要求训练方案的差异化设计。三角肌与肩袖的力量匹配是肩关节安全的基石。\n\n五个板块的统一线索是：检验与控制。波普尔教导我们如何检验理论（否证逻辑）。斯多葛教导我们如何控制注意力（控制二分法）。丙酮酸代谢展示了细胞如何控制能量路径（PDH开关）。自由体图展示了力学如何检验关节负荷（逆动力学）。三角肌三束展示了训练如何精确控制每束肌肉的激活。教练的工作是在所有这些层面运用检验与控制，用否证来检验训练假说，用控制二分法来聚焦可控变量，用代谢知识来理解训练强度，用力学分析来优化动作技术，用解剖精度来设计训练方案。\n\n---\n\n## 引用原句\n\n**1. Chalmers 论否证的演绎逻辑：**\n\n> \"如果一个理论被演绎出的预测被观察证明为假，那么该理论在逻辑上被否证。这就是否定后件式在科学中的应用。\"\n>\n> (Chalmers, *What Is This Thing Called Science?*, Ch5, p.59)\n\n**2. Chalmers 论确证与否证的不对称性：**\n\n> \"无论多少次确证性观察都不能证明一个理论为真，但一次否证性观察就可以在逻辑上否定一个理论。这就是确证与否证之间的不对称性。\"\n>\n> (Chalmers, *What Is This Thing Called Science?*, Ch5, p.61)\n\n**3. Chalmers 论大胆猜测：**\n\n> \"科学并非收集观察事实的归纳过程，而是提出大胆猜测并尝试否证它们的过程。……好的理论敢于做出精确预测，将自己暴露在否证的风险之下。\"\n>\n> (Chalmers, *What Is This Thing Called Science?*, Ch5, p.63)\n\n**4. Chalmers 论不可否证的占星术：**\n\n> \"占星术士的预测极其模糊，无论发生什么都可以被解释为与预测一致。……它们不具备可否证性。\"\n>\n> (Chalmers, *What Is This Thing Called Science?*, Ch5, p.60)\n\n**5. Chalmers 论科学进步通过消除错误：**\n\n> \"科学的进步并非通过归纳积累知识来实现，而是通过消除错误来实现的。每一次否证都排除了一个错误答案，使我们更接近真理。\"\n>\n> (Chalmers, *What Is This Thing Called Science?*, Ch5, p.63)\n\n**6. 爱比克泰德论控制二分法：**\n\n> \"在所有存在的事物中，有些在我们能力范围之内（ta eph' hēmin），有些不在我们能力范围之内（ta ouk eph' hēmin）。\"\n>\n> (Epictetus, *Enchiridion*, 1.1)\n\n**7. 爱比克泰德论可控事物的自由本质：**\n\n> \"在你能力范围内的事物，本质上是自由的，不受阻碍，不受限制。不在你能力范围内的事物是软弱的、奴隶般的、受阻碍的、不属于你自己的。\"\n>\n> (Epictetus, *Enchiridion*, 1.1-2)\n\n**8. 马可·奥勒留论判断与痛苦：**\n\n> \"如果你因任何外部事物而感到痛苦，困扰你的并非事物本身，而是你对它的判断。而这个判断，你有能力随时消除。\"\n>\n> (Marcus Aurelius, *Meditations*, 8.47)\n\n**9. Loeffelholz & Lefavi 论PDH调控：**\n\n> \"丙酮酸脱氢酶复合体是糖有氧氧化的关键调控点，通过磷酸化失活和去磷酸化激活来响应细胞的能量状态。\"\n>\n> (Loeffelholz & Lefavi,《健身营养全书》第2章)\n\n**10. McGinnis 论自由体图：**\n\n> \"自由体图是将研究对象从环境中隔离出来，标注所有作用在其上的外力和力矩。它是力学分析的第一步，也是最关键的一步。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n**11. McGinnis 论深蹲力矩分析：**\n\n> \"在深蹲中，地面反作用力对踝关节的力矩由跖屈肌群的收缩力矩来平衡。随着下蹲深度增加，GRF对踝关节的力臂增大，跖屈肌群需要产生更大的力矩。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n**12. McGinnis 论杠铃位置与力矩分配：**\n\n> \"杠铃位置通过改变躯干倾斜角度来改变髋关节和膝关节之间的力矩分配，进而改变对不同肌群的需求。\"\n>\n> (McGinnis, *Biomechanics of Sport and Exercise*, 3rd ed., Ch4)\n\n**13. Neumann 论三角肌三束激活模式：**\n\n> \"三角肌三束在不同肩关节动作中表现出差异化的激活模式，体现了肌束功能分化的神经控制策略。\"\n>\n> (Neumann, *Kinesiology of the Musculoskeletal System*, 3rd ed., Ch5)\n", "学员手册": "# Lesson 10 学员手册：检验与控制\n\n---\n\n## 第一部分：知识版图（初探）\n\n下面这张表格覆盖今天课程涉及的五个板块。每个板块列出了几个核心问题，试着在横线上填写你的答案。\n\n不会填没关系，先写下你能想到的，学完后再回来。\n\n| 板块 | 引导性问题 | 你的回答 |\n|------|-----------|---------|\n| **板块一：科学哲学** | 1. 否定后件式（modus tollens）的完整科学语境表达是：____→ P；¬P；∴ ____ | |\n| | 2. 确证依赖____推理，否证依赖____推理，两者在逻辑强度上的不对称性在于____ | |\n| | 3. 爱因斯坦广义相对论预测光线偏折____弧秒，与牛顿力学预测的____弧秒不同，这个预测更精确因此可否证度更____ | |\n| | 4. 波普尔的科学进步路径四段图式：____→____→____→____ | |\n| | 5. 拉卡托斯对波普尔否证主义的修正提出了____概念，理论以____为单位运作而非逐个被检验 | |\n| **板块二：哲学** | 1. 斯多葛学派三位核心传承者：____→____→____，其中系统化者是____ | |\n| | 2. 爱比克泰德《手册》开篇的控制二分法：在能力之内的四类是____、____、____和____ | |\n| | 3. 不在能力之内的四类事物：____、____、____和____ | |\n| | 4. 斯多葛从赫拉克利特继承的核心概念是____，其从____论转化为____学 | |\n| | 5. 塞内加的premeditatio malorum（预演不幸）的核心论证逻辑是：____ | |\n| **板块三：营养学** | 1. 丙酮酸穿越线粒体外膜通过____（孔径限制<____），穿越内膜通过____以____共转运方式 | |\n| | 2. PDH复合体三酶：E1（____辅基，负责____）、E2（____辅基，负责____）、E3（____辅基，负责____） | |\n| | 3. PDH失活通过____（PDK催化磷酸化），激活通过____（PDP催化去磷酸化）；Ca²⁺在肌肉收缩时____PDH活性 | |\n| | 4. TCA循环每轮净产出：____CO₂ + ____NADH + ____FADH₂ + ____GTP | |\n| | 5. 每分子葡萄糖完全氧化约____ATP，差异取决于穿梭机制：____穿梭产出较高，____穿梭产出较低 | |\n| | 6. LDH-1（____亚基四聚体）在____中占优势，偏好____方向；LDH-5在____中占优势，偏好____方向 | |\n| **板块四：生物力学** | 1. 自由体图五步：确定____→画出____→标注____→建立____→列出____ | |\n| | 2. 逆动力学从____关节开始逐步向____端推进，踝关节隔离小腿后只有____个未知力矩 | |\n| | 3. 踝关节力矩由____产生对抗____力矩；膝关节由____产生对抗____力矩 | |\n| | 4. 低杠深蹲躯干前倾更____→髋关节力矩更____→膝关节力矩更____；高杠则____ | |\n| | 5. 全蹲时膝关节力矩____于平行蹲（屈曲超90°后力臂____），髋关节力矩____于平行蹲 | |\n| **板块五：解剖** | 1. 三角肌三束起点：前束起自____外侧1/3前面，中束起自____外侧面，后束起自____下唇 | |\n| | 2. 前束功能：肩____、水平____、____旋；中束功能：肩____；后束功能：肩____、水平____、____旋 | |\n| | 3. 三角肌收缩产生向____剪切力，肩袖通过____-____机制对抗 | |\n| | 4. 三束肌腱在三角肌粗隆以不同____和____汇入：前束和中束在____侧融合，后束在____侧汇入 | |\n| | 5. 推类动作为主的训练者后束训练量应____前束，否则导致肱骨头____倾向增加 | |\n\n---\n\n## 第二部分：分段深入学习\n\n---\n\n### 板块一：科学哲学：否证的逻辑\n\n#### A. 核心知识点回顾\n\n1. **否定后件式（modus tollens）的逻辑结构**。否定后件式是演绎推理中最基本的有效形式之一：如果P则Q；非Q；因此非P。在科学语境中，从理论T加辅助假说A加初始条件I推导出可检验预测P（T ∧ A ∧ I → P）。观测到非P时，逻辑上否定的是T ∧ A ∧ I的合取。辅助假说包括测量仪器的可靠性、实验环境的控制条件、背景理论的适用性。初始条件包括实验设置的具体参数。三者缺一不可。\n\n2. **迪昂-奎因论题（Duhem-Quine thesis）**。预测失败时，被否定的是理论+辅助假说+初始条件的整体。科学家可以选择修改辅助假说或质疑初始条件的准确性来保护核心理论。这在逻辑上是允许的。波普尔的回应是方法论的：科学规范要求认真对待否证，将其视为对核心理论的挑战，而非用特设性假说（ad hoc hypothesis）无限保护核心理论。\n\n3. **确证与否证的不对称性**。确认依赖归纳推理（从有限到全称，逻辑上不保真），否证依赖演绎推理（否定后件式，逻辑上有效）。百万次确认不能逻辑上证明理论为真，第10001只天鹅可能是黑的。一次否证在逻辑上足以否定全称命题。不对称性的根源在于推理类型的差异：归纳的结论永远超出前提范围，演绎的前提为真时结论必然为真。\n\n4. **大胆猜测（bold conjectures）与预测精度**。理论内容越丰富、预测越精确，可否证度越高，信息含量越大。爱因斯坦广义相对论预测光线偏折1.75弧秒（区别于牛顿力学的0.87弧秒）是大胆猜测的范例。预测范围越宽的理论（\"大约0.5到2弧秒\"）越难被否证但信息含量越低。波普尔的判断：大胆猜测优于谨小慎微的模糊陈述。\n\n5. **科学进步路径与逼真度**。问题（P1）→试探性理论（TT）→否证尝试（EE）→新问题（P2）。波普尔用\"逼真度\"（verisimilitude）描述进步方向。经受住严格检验的理论暂时被保留（corroborated），但\"更接近真理\"不等于\"到达真理\"。科学进步是通过消除错误（error elimination），不是通过归纳积累知识。\n\n6. **拉卡托斯的修正**。波普尔否证主义面临一个严肃困难：科学史上许多成功理论在早期就存在反常（anomalies）。拉卡托斯提出\"科学研究纲领方法论\"（research programmes）：理论以研究纲领为单位运作，包含\"硬核\"（hard core）和\"保护带\"（protective belt）。保护带的调整是正常科学活动的一部分，只有当纲领退化为不断用特设性假说修补时才应被放弃。\n\n#### B. 封闭式选择题\n\n**1. 在否证逻辑 T ∧ A ∧ I → P 中，当观测到¬P时，以下哪项描述最准确？**\n\nA. 核心理论T被确定性地否定\nB. T ∧ A ∧ I 整体被否定，但具体哪个组成部分被否定需要进一步排查\nC. 只有辅助假说A被否定\nD. 实验设计有误，否证无效\n\n**2. 波普尔认为爱因斯坦广义相对论比牛顿力学\"更科学\"的原因是什么？**\n\nA. 广义相对论被更多实验证实了\nB. 广义相对论做出了更精确、更冒险的预测（1.75弧秒 vs 0.87弧秒），将自身暴露在更高的否证风险下\nC. 广义相对论的数学更复杂\nD. 广义相对论是更新的理论\n\n**3. 关于科学进步路径，以下哪项正确描述了波普尔的四段图式？**\n\nA. 观察→归纳→理论→更多观察\nB. 问题→试探性理论→否证尝试→新问题\nC. 假设→实验→证实→定律\nD. 理论→预测→确认→真理\n\n**4. \"逼真度\"（verisimilitude）在波普尔体系中的含义是什么？**\n\nA. 科学理论已经到达真理\nB. 经受住严格检验的理论比未经检验的理论更接近真理，但\"更接近\"不等于\"到达\"\nC. 理论的可证实程度\nD. 科学共同体的共识程度\n\n**5. 拉卡托斯对波普尔否证主义的核心修正是什么？**\n\nA. 否证在逻辑上是不可能的\nB. 理论以研究纲领为单位运作，保护带的调整是正常的，只有纲领退化时才应放弃\nC. 科学不需要否证\nD. 辅助假说永远不需要修改\n\n---\n\n### 板块二：哲学：斯多葛·控制二分法\n\n#### A. 核心知识点回顾\n\n1. **斯多葛学派谱系与赫拉克利特的遗产**。基提翁的芝诺（Zeno of Citium，约前334-前262年）在雅典集市的彩色柱廊（stoa poikilē）讲学，创立斯多葛学派。传承：芝诺→克莱安特斯→克律西波斯（系统化者，据说写过700多卷著作）。斯多葛继承赫拉克利特的逻各斯（logos），将其从宇宙论命题转化为伦理命题：既然宇宙受理性法则统摄，人应\"顺应自然而活\"。\n\n2. **控制二分法的原始文本**。爱比克泰德（约50-135年）《手册》开篇：\"在所有存在的事物中，有些在我们能力范围之内（ta eph' hēmin），有些不在（ta ouk eph' hēmin）。\"在能力之内的四项：判断（hypolēpsis）、冲动（hormē）、欲望（orexis）、厌恶（ekklisis），所有属于我们自己的行为。不在能力之内的：身体（sōma）、财产（ktēmata）、名声（doxa）、职位（archai），所有不属于我们的东西。\n\n3. **伦理实践含义**。痛苦来自把幸福寄托在不在能力之内的东西上。如果你把幸福建立在身体健美、财富积累、他人评价上，当这些东西被夺走时你必然痛苦。痛苦不在事物本身，在于你把意志依附在了错误的位置上。自由在于只关注你能控制的，你的判断、选择和行动意图。没有任何外部力量能阻止你做出正确的判断。\n\n4. **塞内加的premeditatio malorum**。塞内加（约前4年-65年）在《道德书简》中提出预演不幸的练习。核心论证：你害怕失去的东西（财富、地位、健康），在你真正失去之前就已经在精神上奴役了你。主动想象最坏情况，发现即使在最坏情况下你的判断力仍然完好。预演不是悲观主义，是精神自由的训练。\n\n5. **马可·奥勒留的内化**。马可·奥勒留（121-180年）在《沉思录》（Ta eis heauton，\"致自己\"）中将控制二分法彻底内化。作为罗马皇帝面对战争、瘟疫、政治阴谋，这些都在不可控类别中，他将所有外部事件视为\"自然的一部分\"（kata physis），将注意力收回到自己的判断上。抱怨外部事件等于抱怨自然本身。\n\n6. **教练实践中的应用**。教练能控制的是方案设计的科学性和执行严谨性，不能控制客户的基因、睡眠质量、压力水平、配合程度。把注意力锁定在不可控目标上（\"客户必须减脂X kg\"），焦虑是必然的。控制二分法不是说\"不在意结果\"，而是说\"把注意力放在你能控制的变量上，让结果自然发生\"。\n\n#### B. 封闭式选择题\n\n**1. 爱比克泰德《手册》中\"不在我们能力范围之内\"的事物包括？**\n\nA. 判断和选择\nB. 身体、财产、名声和职位\nC. 行动意图和冲动\nD. 个人的理性能力\n\n**2. 斯多葛学派从赫拉克利特继承并转化的核心概念是？**\n\nA. 万物皆流（panta rhei），存在即变化\nB. 逻各斯（logos），从宇宙论的理性秩序转化为伦理学的\"顺应自然而活\"\nC. 对立统一，对立面的斗争是变化的动力\nD. 火作为万物本原，火是一种过程而非物质\n\n**3. 塞内加premeditatio malorum（预演不幸）的核心论证是？**\n\nA. 悲观地等待灾难降临\nB. 你害怕失去的东西在真正失去之前就已经奴役了你；主动想象最坏情况，发现你的判断力仍然完好\nC. 通过物质准备来预防所有可能的损失\nD. 避免所有可能导致不幸的活动\n\n**4. 从赫拉克利特到斯多葛的思想演变中，关键转变是什么？**\n\nA. 从伦理学到物理学\nB. 从宇宙论命题（逻各斯是万物的理性秩序）到伦理命题（人应让自己的理性与宇宙理性对齐）\nC. 从认识论到形而上学\nD. 从怀疑主义到教条主义\n\n**5. 一个教练因客户受伤而自责。从控制二分法的角度，以下哪项分析最准确？**\n\nA. 教练应该对所有客户受伤负全责\nB. 教练能控制方案设计的科学性和安全提示，但客户的执行质量、日常活动、突发意外不完全在教练控制范围内；教练应反思方案设计是否有可改进之处，而非为不可控因素自责\nC. 教练不应该在意客户是否受伤\nD. 自责说明教练有职业道德\n\n---\n\n### 板块三：营养学：丙酮酸的命运\n\n#### A. 核心知识点回顾\n\n1. **丙酮酸跨线粒体膜转运**。丙酮酸在细胞质中生成后穿越线粒体两层膜。外膜通过电压依赖性阴离子通道（VDAC），孔径约2.5-3 nm，允许<5 kDa的小分子自由通过。内膜通过线粒体丙酮酸转运体（MPC），以H⁺共转运方式从膜间隙进入基质，驱动力来自电子传递链建立的质子梯度。\n\n2. **PDH复合体的结构与催化机制**。三种酶按精确化学计量比组装。E1（丙酮酸脱羧酶，TPP辅基）：TPP的噻唑环碳负离子攻击丙酮酸羰基碳，释放CO₂，生成羟乙基-TPP中间体。E2（二氢硫辛酰胺转乙酰酶，硫辛酰胺辅基）：硫辛酰胺通过赖氨酸残基以共价酰胺键悬挂，像\"摆臂\"接收E1的羟乙基，氧化为乙酰基后转移给CoA-SH生成乙酰CoA。E3（二氢硫辛酰胺脱氢酶，FAD/NAD⁺辅基）：重新氧化硫辛酰胺的摆臂，FADH₂将电子传给NAD⁺生成NADH。三活性中心通过摆臂串联，实现底物通道效应（substrate channeling）。\n\n3. **PDH的多层次调控**。磷酸化（PDK催化E1丝氨酸磷酸化）使PDH失活；去磷酸化（PDP催化）使PDH激活。产物抑制：乙酰CoA和NADH高水平→激活PDK→抑制PDH。底物解除抑制：CoA-SH和NAD⁺高水平→抑制PDK→解除对PDH的抑制。肌肉收缩时Ca²⁺升高→激活PDP→激活PDH，打通有氧通路。DCA是PDK抑制剂，保持PDH活化状态。\n\n4. **TCA循环与电子传递链的能量产出**。每分子乙酰CoA经TCA循环产出2 CO₂ + 3 NADH + 1 FADH₂ + 1 GTP（8步酶促反应）。NADH通过复合体I→CoQ→复合体III→Cyt c→复合体IV→O₂传递电子。FADH₂从复合体II进入CoQ。质子梯度驱动ATP合酶（化学渗透假说，Peter Mitchell 1961, Nobel 1978）。每分子葡萄糖完全氧化约30-32 ATP，差异取决于穿梭机制：苹果酸-天冬氨酸穿梭（胞质NADH电子送入基质，约32 ATP）vs 甘油-3-磷酸穿梭（电子送入CoQ水平，绕过复合体I，约30 ATP）。\n\n5. **无氧条件下乳酸生成与NAD⁺再生**。LDH催化：丙酮酸 + NADH + H⁺ → 乳酸 + NAD⁺。关键不在乳酸本身，在于NAD⁺再生，维持GAPDH反应和糖酵解持续运转。无氧条件下糖酵解是唯一可用ATP来源，LDH保证这个来源不被中断。LDH同工酶：LDH-1（H₄，心肌优势，偏好乳酸→丙酮酸方向）、LDH-5（M₄，骨骼肌优势，偏好丙酮酸→乳酸方向）。\n\n6. **乳酸去路与乳酸阈值**。三条主要去路：①MCT1转运至氧化型肌纤维（type I）和心肌，经LDH-1转化为丙酮酸后有氧化；②MCT1转运至肝脏经Cori循环糖异生（消耗6 ATP，净损失4 ATP）；③少量随尿液排出。MCT4主要在糖酵解型肌纤维（type II）表达，负责将乳酸排出细胞。乳酸阈值（LT）是血乳酸浓度开始加速上升的运动强度，与MLSS（最大乳酸稳态）密切相关，比VO₂max更能预测耐力运动表现。\n\n#### B. 封闭式选择题\n\n**1. PDH复合体中硫辛酰胺\"摆臂\"的分子机制是什么？**\n\nA. 硫辛酰胺直接参与ATP合成\nB. 硫辛酰胺通过赖氨酸残基以共价酰胺键悬挂在E2核心上，在E1、E2、E3三个活性中心之间传递中间产物，实现底物通道效应\nC. 硫辛酰胺是PDH的磷酸化位点\nD. 硫辛酰胺直接催化丙酮酸的脱羧反应\n\n**2. 关于Ca²⁺在肌肉收缩时对PDH的调控，以下哪项描述正确？**\n\nA. Ca²⁺激活PDK使PDH磷酸化失活\nB. Ca²⁺激活PDP使PDH去磷酸化激活，打通有氧代谢通路以匹配肌肉能量需求\nC. Ca²⁺不影响PDH活性\nD. Ca²⁺抑制PDH使丙酮酸转向乳酸生成\n\n**3. 每分子葡萄糖完全氧化产生30 vs 32 ATP的差异取决于？**\n\nA. 不同个体的线粒体密度不同\nB. 胞质NADH通过线粒体内膜的穿梭机制：苹果酸-天冬氨酸穿梭将电子送入复合体I（产出较高，约32 ATP），甘油-3-磷酸穿梭将电子送入CoQ水平（绕过复合体I，产出较低，约30 ATP）\nC. TCA循环在不同组织中的效率不同\nD. 电子传递链中复合体IV的活性差异\n\n**4. LDH-1（H₄同工酶）在心肌中占优势的生理意义是什么？**\n\nA. 心肌需要大量产生乳酸\nB. 心肌偏好以乳酸为燃料，LDH-1高效地将乳酸转化回丙酮酸进入有氧氧化；骨骼肌产生的乳酸可以成为心脏的能源\nC. LDH-1催化乳酸生成以保护心肌免受酸中毒\nD. 心肌不使用有氧代谢\n\n**5. 乳酸阈值（LT）比VO₂max更能预测耐力运动表现的原因是什么？**\n\nA. LT的测量比VO₂max更简单\nB. LT直接对应肌肉在有氧供能和糖酵解供能之间的转换点，即乳酸生成速率首次超过清除速率的运动强度\nC. VO₂max与耐力表现无关\nD. LT受训练影响而VO₂max不受影响\n\n---\n\n### 板块四：生物力学：自由体图分析深蹲\n\n#### A. 核心知识点回顾\n\n1. **自由体图的定义与核心步骤**。将研究对象从周围环境中隔离出来，标注所有外力和力矩的简图。五步：①确定研究对象（整体/单肢体段/单关节）；②画出隔离体；③标注所有外力（重力W、GRF、JRF、肌肉力）；④建立坐标系；⑤列出平衡方程。静态条件下三个方程：ΣFx=0, ΣFy=0, ΣM=0。自由体图是牛顿力学分析的起点，所有关节力矩计算从这里开始。\n\n2. **逆动力学分析的方法论**。从最远端关节开始逐步向近端求解。踝关节隔离小腿后只有一个未知关节力矩，方程可直接求解。膝关节使用前一步踝关节的结果作为已知条件。髋关节使用前两步的结果。\"净力矩\"（net moment）是所有肌肉力矩的合力矩效果，不等于单块肌肉的力。\n\n3. **三个关节的力矩分析**。踝关节：GRF在踝前方产生背屈力矩，跖屈肌群（腓肠肌+比目鱼肌）产生对抗的跖屈力矩。膝关节：GRF在膝前方产生屈曲力矩，股四头肌产生伸展力矩对抗。髋关节：躯干前倾时GRF和杠铃重力产生屈曲力矩，臀大肌和腘绳肌产生伸展力矩对抗。\n\n4. **不同深度的力矩变化**。半蹲时膝伸展力矩较高（膝关节在力臂最大区间），髋伸展力矩较低。平行蹲时膝和髋力矩都较大。全蹲时膝关节力矩可能低于平行蹲（屈曲超90°后力臂缩短），但髋关节力矩持续增大（躯干前倾增大）。全蹲对髋关节灵活性和核心稳定性要求更高。\n\n5. **杠铃位置的力学效应**。高杠（C7-T1水平）：躯干更直立→膝关节力矩增大、髋关节力矩减小→更多刺激股四头肌。低杠（肩胛冈水平附近）：杠铃重心相对髋关节更靠后→躯干需更大前倾→髋关节力矩增大（约20-30%）、膝关节力矩减小→更多刺激臀大肌和腘绳肌。\n\n6. **髌骨的力学作用**。髌骨增大股四头肌力线到膝关节旋转中心的力臂。没有髌骨，股四头肌需多产生约30%的力才能产生同样的膝伸展力矩。这是髌骨切除术后股四头肌功能显著下降的力学基础。\n\n#### B. 封闭式选择题\n\n**1. 自由体图在力学分析中的作用是什么？**\n\nA. 测量肌肉的肌电图活性\nB. 将研究对象从环境中隔离出来，标注所有外力和力矩，为列平衡方程和求解关节力矩提供基础\nC. 直接计算肌肉力量\nD. 评估关节活动度\n\n**2. 深蹲下降过程中，为什么腓肠肌和比目鱼肌的需求增大？**\n\nA. 体重增大了\nB. 膝关节屈曲角度增大导致小腿前倾角度增大，GRF相对于踝关节的力臂增大，背屈力矩增大，需要更大的跖屈力矩对抗\nC. 杠铃重量增加了\nD. 地面反作用力减小了\n\n**3. 关于高杠和低杠深蹲的力学差异，以下哪项描述正确？**\n\nA. 两者对关节力矩分布没有影响\nB. 低杠使躯干前倾增大，髋关节力矩增大（约20-30%），膝关节力矩减小\nC. 高杠使髋关节力矩增大\nD. 低杠使膝关节力矩增大\n\n**4. 髌骨在膝关节力学中的作用是什么？**\n\nA. 保护膝关节免受外力\nB. 增大股四头肌力线到膝关节旋转中心的力臂，没有髌骨股四头肌需多产生约30%的力\nC. 增加膝关节的活动度\nD. 减少膝关节的摩擦力\n\n**5. 深蹲逆动力学分析中，膝关节力矩的求解依赖于？**\n\nA. 仅依赖地面反作用力\nB. 前一步踝关节分析的结果（小腿段传来的力和力矩）加上作用在大腿段的其他外力\nC. 直接测量股四头肌的肌力\nD. 仅依赖髋关节的分析结果\n\n---\n\n### 板块五：解剖：三角肌三束\n\n#### A. 核心知识点回顾\n\n1. **三角肌整体结构与三束分化**。大而表浅的多羽肌（multipennate muscle），覆盖肩关节外侧。止点统一为肱骨外侧中段的三角肌粗隆（deltoid tuberosity），起点分三部分。三束肌纤维以不同角度汇聚到三角肌粗隆，产生力线方向分化。\n\n2. **三束的起止点、力线与功能**。前束（anterior/clavicular fibers）起自锁骨外侧1/3前面，力线从前上→后下，功能为肩屈曲（0-90°）、水平内收、内旋。中束（middle/acromial fibers）起自肩峰外侧面，力线几乎纯外侧（垂直于肱骨长轴，力臂效率高），功能为肩外展（15-90°主要力量来源）。后束（posterior/scapular spine fibers）起自肩胛冈下唇，力线从后上→前下，功能为肩伸展、水平外展、外旋。\n\n3. **三角肌粗隆处的肌腱融合模式**。三束肌纤维在肱骨外侧以不同角度和层次汇入。前束和中束肌腱在桡侧（近端）融合，后束肌腱在尺侧（远端）汇入。这种分层融合使不同束在不同肩关节角度下具有不同的力臂效率，同一块肌肉内部也存在力学分化。\n\n4. **三束协同与选择性激活**。日常动作中三束通常协同收缩（外展时中束主导，前束辅助屈曲分量，后束辅助伸展分量）。特定动作中可选择性激活：前平举→前束EMG最高；侧平举→中束最高；俯身飞鸟→后束最高。\n\n5. **三角肌-肩袖的力学关系**。三角肌收缩时产生向上剪切力（superior shear force），将肱骨头推向肩峰下间隙。肩袖通过压缩-中心化（compression-centering）机制将肱骨头向下压入关节盂中心。冈上肌力线几乎垂直向下，直接对抗三角肌向上剪切力。三角肌是\"发动机\"，肩袖是\"稳定平台\"。没有肩袖稳定，三角肌每次收缩都在制造撞击风险。\n\n6. **训练应用与失衡后果**。推类动作过度发达前束和胸大肌→前束过度活跃加后束无力→肱骨头前移倾向增加→肩峰下间隙减小→撞击风险增大。训练方案应确保三束均衡：前束（前平举、上斜卧推）、中束（侧平举、直立划船）、后束（俯身飞鸟、面拉）。推类动作为主的训练者，后束训练量应不少于前束。\n\n#### B. 封闭式选择题\n\n**1. 三角肌中束在肩外展15-90°范围内占主导地位的结构基础是？**\n\nA. 中束的肌纤维数量最多\nB. 中束力线几乎垂直于肱骨长轴，力臂效率高\nC. 中束的神经支配最强\nD. 中束的代谢能力最强\n\n**2. 三角肌粗隆处三束肌腱的融合模式是什么？**\n\nA. 三束以单一肌腱均匀附着\nB. 前束和中束在桡侧（近端）融合，后束在尺侧（远端）汇入，不同束在不同肩关节角度下具有不同的力臂效率\nC. 后束和中束融合，前束独立\nD. 三束互不干扰，完全独立附着\n\n**3. 肩袖在三角肌-肩袖力学关系中的核心角色是？**\n\nA. 提供主要的运动动力\nB. 通过压缩-中心化机制将肱骨头向下压入关节盂中心，对抗三角肌的向上剪切力，为三角肌提供稳定的工作平台\nC. 控制肩胛骨的位置\nD. 产生肩关节的外展力矩\n\n**4. 以下哪项训练动作组合最能均衡训练三角肌三束？**\n\nA. 卧推+过头推举+俯卧撑\nB. 前平举（前束）+ 侧平举（中束）+ 面拉/俯身飞鸟（后束）\nC. 引体向上+划船+弯举\nD. 侧平举+耸肩+前平举\n\n**5. 长期以推类动作为主、忽略后束训练的训练者最可能的肩部力学变化是？**\n\nA. 肩关节稳定性全面增强\nB. 前束过度活跃加后束无力→肱骨头前移倾向→肩峰下间隙减小→撞击风险增大\nC. 中束代偿性肥大，肩部外观改善\nD. 肩袖功能不受训练方式影响\n\n---\n\n## 第三部分：今日核心逻辑\n\n今天五个板块的共同主题是**检验与控制**。\n\n波普尔的否证主义是\"检验\"的方法论版本。否定后件式（T ∧ A ∧ I → P; ¬P; ∴ ¬(T ∧ A ∧ I)）提供了严格的逻辑工具来检验科学理论。确证和否证之间的不对称性，归纳弱、演绎强，决定了科学理论永远是暂时的。大胆猜测优于模糊陈述，因为更精确的预测意味着更高的否证风险和更大的信息含量。科学进步通过消除错误来逼近真理，逼真度（verisimilitude）描述这个方向。\n\n斯多葛的控制二分法是\"控制\"的伦理版本。爱比克泰德的原始区分清晰而严格：判断、冲动、欲望、厌恶在控制之内；身体、财产、名声、职位不在。塞内加的premeditatio malorum和马可·奥勒留的内化将这一区分从理论推向实践。从赫拉克利特的逻各斯到斯多葛的伦理学，宇宙论的理性秩序变成了日常生活的控制框架。\n\n丙酮酸的两条命运展示了代谢层面的\"控制点\"。PDH复合体是丙酮酸有氧/无氧分叉的关键开关，磷酸化失活、去磷酸化激活、Ca²⁺在运动时激活。TCA循环和电子传递链将乙酰CoA完全氧化，产出约30-32 ATP。无氧条件下LDH再生NAD⁺维持糖酵解运转。乳酸不是废物，通过MCT转运至氧化型纤维再利用、经Cori循环糖异生。乳酸阈值是训练负荷控制的重要参考指标。\n\n自由体图是力学层面的\"检验工具\"。隔离研究对象、标注所有外力、列平衡方程，这三个步骤将模糊的力学直觉转化为可计算的方程。逆动力学从踝关节到膝关节到髋关节逐步求解，揭示了深蹲中力矩分布的内在逻辑。杠铃位置（高杠vs低杠）和训练深度（半蹲vs平行蹲vs全蹲）通过改变力臂长度来改变力矩分配，这是力学方程决定的，不是\"偏好\"。\n\n三角肌三束展示了结构层面的\"控制\"。前束屈曲、中束外展、后束伸展，三束有不同的起止点、力线方向和力臂效率。三角肌提供动力，肩袖提供稳定平台。三束训练均衡是肩部力学健康的基础条件。推类动作为主的训练者必须刻意加强后束训练，否则肱骨头前移和撞击风险将随之而来。\n\n教练的任务：在所有层面建立检验标准和控制能力。用否证检验训练假说，每个方案都应有明确的否证条件。用控制二分法管理注意力，关注方案质量和执行严谨性，不执着于不可控的结果。用代谢知识控制营养时机，理解丙酮酸的代谢命运才能设计训练前后的营养策略。用力学分析控制负荷，自由体图将主观感受转化为客观的关节力矩。用解剖知识控制动作选择，三束分化决定了不同动作对不同束的刺激分布。检验与控制贯穿从方法论到分子代谢到宏观力学的每一个层面。\n", "作业": "# Lesson 10 作业：检验与控制\n\n---\n\n## 第一部分：知识版图（初探）\n\n下面这张表格覆盖今天课程涉及的五个板块。每个板块列出了几个核心问题，试着在横线上填写你的答案。\n\n不会填没关系，先写下你能想到的，学完后再回来。\n\n| 板块 | 引导性问题 | 你的回答 |\n|------|-----------|---------|\n| **板块一：科学哲学** | 1. 否定后件式（modus tollens）的逻辑结构是：T ∧ A ∧ I → P；____；因此____ | |\n| | 2. 确证与否证的不对称性在于：确认依赖____推理（逻辑上____），否证依赖____推理（逻辑上____） | |\n| | 3. 波普尔描述的科学进步路径是：____→____→____→____ | |\n| | 4. 理论的预测越精确、越冒险，它的可否证度越____，信息含量越____ | |\n| **板块二：哲学** | 1. 爱比克泰德《手册》开篇将事物分为两类：____（ta eph' hēmin）和____（ta ouk eph' hēmin） | |\n| | 2. 在我们能力之内的四项是：____、____、____和____ | |\n| | 3. 斯多葛学派的创始人是____，系统化者是____ | |\n| | 4. 斯多葛从赫拉克利特继承的核心概念是____，将其从宇宙论转化为____ | |\n| **板块三：营养学** | 1. 丙酮酸进入线粒体内膜需要通过____转运体，以____共转运方式 | |\n| | 2. PDH复合体由三种酶组成：E1（辅基____）、E2（辅基____）、E3（辅基____） | |\n| | 3. 无氧条件下LDH催化丙酮酸还原为乳酸的关键意义在于____ | |\n| | 4. Cori循环将乳酸在肝脏中重新合成葡萄糖，消耗____ATP，糖酵解仅产生____ATP | |\n| **板块四：生物力学** | 1. 自由体图的绘制步骤：确定____→画出____→标注____→建立____→列出____ | |\n| | 2. 深蹲逆动力学分析从____关节开始，因为该关节隔离后只有____个未知力矩 | |\n| | 3. 低杠深蹲相比高杠深蹲，躯干前倾角度更____，髋关节力矩更____，膝关节力矩更____ | |\n| | 4. 全蹲时膝关节力矩可能____于平行蹲，但髋关节力矩____于平行蹲 | |\n| **板块五：解剖** | 1. 三角肌前束起自____外侧1/3，中束起自____，后束起自____ | |\n| | 2. 三角肌三束中，肩外展的主要力量来源是____束，肩屈曲的主要贡献者是____束 | |\n| | 3. 三角肌收缩时肱骨头有向____移位的趋势，肩袖通过____机制对抗 | |\n| | 4. MCT1主要表达在____肌纤维和心肌，负责____转运；MCT4主要在____肌纤维表达 | |\n\n---\n\n## 第二部分：分段深入学习\n\n---\n\n### 板块一：科学哲学：否证的逻辑\n\n#### A. 核心知识点回顾\n\n1. **否证的演绎逻辑结构**。否定后件式（modus tollens）是波普尔否证主义的逻辑基础。科学语境中，从理论T加辅助假说A加初始条件I推导出可检验预测P（T ∧ A ∧ I → P）。观测到非P时，逻辑上否定的是T ∧ A ∧ I的合取，不是单独的T。迪昂-奎因论题（Duhem-Quine thesis）指出科学家可以通过修改辅助假说来保护核心理论，这是逻辑上允许的策略。波普尔的回应是方法论的：科学规范要求认真对待否证。\n\n2. **确证与否证的不对称性**。确认依赖归纳推理（从有限到全称，逻辑上不保真），否证依赖演绎推理（否定后件式，逻辑上有效）。百万次确认不能逻辑上证明理论为真，一次否证在逻辑上足以否定全称命题。不对称性的根源在于推理类型的差异。被保留的理论不是\"更真\"，是\"尚未被否证\"。\n\n3. **大胆猜测与预测精度**。理论内容越丰富、预测越精确，可否证度越高，信息含量越大。爱因斯坦广义相对论预测光线偏折1.75弧秒（区别于牛顿力学的0.87弧秒）是大胆猜测的范例，做出精确且冒险的预测，将自身暴露在高否证风险下。预测范围越宽的理论越难被否证但信息含量越低。\n\n4. **科学进步路径与逼真度**。问题（P1）→试探性理论（TT）→否证尝试（EE）→新问题（P2）。波普尔用\"逼真度\"（verisimilitude）描述进步方向。经受住严格检验的理论被暂时保留（corroborated），但科学永远不能宣称拥有最终真理。科学进步不是通过归纳积累知识，而是通过消除错误。\n\n#### B. 封闭式选择题\n\n**1. 在波普尔的否证逻辑中，T ∧ A ∧ I → P 中的 A 代表什么？**\n\nA. 实验结果（actual observation）\nB. 辅助假说（auxiliary hypotheses），包括仪器可靠性、环境控制、背景理论适用性等\nC. 理论公理（axioms）\nD. 归纳推论（analogy inference）\n\n**2. 关于迪昂-奎因论题（Duhem-Quine thesis），以下哪项描述最准确？**\n\nA. 每个理论都可以被单独否证，不需要考虑辅助假说\nB. 当预测失败时，被否定的是理论+辅助假说+初始条件的整体，科学家可以选择修改辅助假说来保护核心理论\nC. 辅助假说在科学检验中完全不重要\nD. 否证只能针对初始条件，不能针对理论本身\n\n**3. 从波普尔视角看，以下哪种说法最符合\"大胆猜测\"的标准？**\n\nA. \"训练总会有效果的\"\nB. \"该客户4周内深蹲1RM预计提高5-8%，若未达到则重新评估方案\"\nC. \"每个人的体质不同，方案效果因人而异\"\nD. \"根据经验，这个方案效果不错\"\n\n**4. 关于确证与否证的不对称性，以下哪项描述最准确？**\n\nA. 确认100次和否证1次的逻辑强度相同\nB. 确认依赖演绎推理，否证依赖归纳推理\nC. 确认依赖归纳推理（逻辑上不保真），否证依赖演绎推理（逻辑上有效），百万次确认不抵一次否证\nD. 确认和否证都是归纳推理的不同形式\n\n**5. 在教练实践中，一个训练方案如果没有设定否证条件，从波普尔的视角看，这个方案属于什么？**\n\nA. 科学方案，因为已经经过了验证\nB. 工作假设，但缺乏否证条件意味着它不可否证，更接近信仰而非科学\nC. 实验方案，需要更多数据支持\nD. 经验方案，不需要逻辑验证\n\n---\n\n### 板块二：哲学：斯多葛·控制二分法\n\n#### A. 核心知识点回顾\n\n1. **斯多葛学派谱系与赫拉克利特的遗产**。基提翁的芝诺（Zeno of Citium）创立斯多葛学派，在雅典集市的彩色柱廊（stoa poikilē）讲学。传承谱系：芝诺→克莱安特斯→克律西波斯（系统化者）。斯多葛继承赫拉克利特的逻各斯概念，将其从宇宙论命题（万物变化中的理性秩序）转化为伦理命题（人应顺应理性自然秩序而活）。物理学成为伦理学的基础。\n\n2. **控制二分法的原始表述**。爱比克泰德《手册》开篇：\"在所有存在的事物中，有些在我们能力范围之内（ta eph' hēmin），有些不在（ta ouk eph' hēmin）。\"在能力之内的：判断（hypolēpsis）、冲动（hormē）、欲望（orexis）、厌恶（ekklisis），所有属于我们自己的行为。不在能力之内的：身体、财产、名声、职位，所有不属于我们的东西。\n\n3. **伦理实践含义**。痛苦来自把幸福寄托在不在能力之内的东西上。自由在于只关注你能控制的。控制二分法不是说\"不在意结果\"，而是说\"把注意力放在你能控制的变量上，让结果自然发生\"。在教练语境中：教练能控制方案设计的科学性和执行严谨性，不能控制客户的基因、睡眠质量、压力水平等外部因素。\n\n4. **塞内加的预演不幸与马可·奥勒留的内化**。塞内加《道德书简》提出premeditatio malorum，主动想象最坏情况，发现即使在最坏情况下你的判断力仍然完好。马可·奥勒留《沉思录》将控制二分法彻底内化，将所有外部事件视为自然的一部分，将注意力收回到自己的判断上。\n\n#### B. 封闭式选择题\n\n**1. 爱比克泰德《手册》中\"在我们能力范围之内\"的事物包括以下哪项？**\n\nA. 身体健康状况\nB. 判断（hypolēpsis）和冲动（hormē）\nC. 社会名声和地位\nD. 身体的衰老过程\n\n**2. 斯多葛学派从赫拉克利特继承并伦理化的核心概念是？**\n\nA. 万物皆流（panta rhei）\nB. 逻各斯（logos），从宇宙论的理性秩序转化为伦理学的\"顺应自然而活\"\nC. 对立统一\nD. 火作为万物本原\n\n**3. 一个教练因客户体重没有按预期下降而感到焦虑。从控制二分法的角度，以下哪项分析最准确？**\n\nA. 教练应该换客户，因为这个客户不配合\nB. 体重下降速度不完全在教练控制范围内（受基因、睡眠、压力等影响），教练应将注意力集中在方案质量和执行严谨性上\nC. 教练应该向客户保证体重一定会降\nD. 焦虑说明教练不够专业，应该消除所有情绪\n\n**4. 塞内加的premeditatio malorum（预演不幸）练习的核心目的是什么？**\n\nA. 预测未来可能发生的所有灾难并制定应对计划\nB. 通过主动想象最坏情况，发现即使在最坏情况下你的判断力仍然完好，从而实现精神自由\nC. 提醒自己生活是不公平的，从而降低期望值\nD. 训练自己在面对困难时保持情感麻木\n\n**5. 从赫拉克利特到斯多葛学派的思想演变中，关键转变是什么？**\n\nA. 从伦理学到物理学的转变\nB. 从逻各斯作为宇宙论的理性秩序转化为伦理学的\"顺应自然而活\"\nC. 从否定变化到接受变化的转变\nD. 从多神论到一神论的转变\n\n---\n\n### 板块三：营养学：丙酮酸的命运\n\n#### A. 核心知识点回顾\n\n1. **丙酮酸跨线粒体膜转运与PDH复合体**。丙酮酸穿越线粒体外膜通过VDAC孔蛋白（分子量限制<5 kDa），穿越内膜通过MPC（线粒体丙酮酸转运体），以H⁺共转运方式进入基质。PDH复合体催化丙酮酸氧化脱羧生成乙酰CoA + CO₂ + NADH。三种酶：E1（TPP辅基，丙酮酸脱羧）、E2（硫辛酰胺辅基，转乙酰）、E3（FAD/NAD⁺，重新氧化硫辛酰胺）。硫辛酰胺作为\"摆臂\"在三个活性中心之间传递中间产物，实现底物通道效应。\n\n2. **PDH的调控机制**。磷酸化（PDK催化）使PDH失活，去磷酸化（PDP催化）使PDH激活。乙酰CoA/NADH高水平→激活PDK→抑制PDH（产物抑制）。Ca²⁺在肌肉收缩时激活PDP→激活PDH。DCA是PDK抑制剂，通过抑制PDK保持PDH活化状态。\n\n3. **TCA循环与电子传递链的能量产出**。每分子乙酰CoA经TCA循环产出2 CO₂ + 3 NADH + 1 FADH₂ + 1 GTP。NADH通过复合体I进入ETC，FADH₂从复合体II进入。电子经CoQ→复合体III→Cyt c→复合体IV→O₂（最终电子受体）。质子梯度驱动ATP合酶（化学渗透假说，Peter Mitchell 1961）。每分子葡萄糖完全氧化约30-32 ATP，差异取决于穿梭机制（苹果酸-天冬氨酸穿梭 vs 甘油-3-磷酸穿梭）。\n\n4. **无氧条件下乳酸生成与NAD⁺再生**。LDH催化丙酮酸 + NADH + H⁺ → 乳酸 + NAD⁺。关键不在乳酸本身，在于NAD⁺再生，维持GAPDH反应和糖酵解持续运转。糖酵解第6步（GAPDH催化甘油醛-3-磷酸氧化）需要NAD⁺作为电子受体，如果不把NADH重新氧化为NAD⁺，NAD⁺池会在几步反应内耗尽，糖酵解停止，ATP产出归零。LDH同工酶：LDH-1（H₄，心肌优势，偏好乳酸→丙酮酸）、LDH-5（M₄，骨骼肌优势，偏好丙酮酸→乳酸）。\n\n5. **乳酸去路与乳酸阈值**。三条去路：①MCT1转运至氧化型肌纤维和心肌氧化供能；②MCT1转运至肝脏经Cori循环糖异生（消耗6ATP，净亏损4ATP）；③少量随尿液排出。乳酸阈值（LT）是血乳酸浓度开始加速上升的运动强度，与最大乳酸稳态（MLSS）密切相关，比VO₂max更能预测耐力运动表现。对于力量训练教练来说，力量训练中高次数组（如15-20次）会显著激活糖酵解系统，产生大量乳酸。通过有氧训练提高乳酸清除能力，可以间接提高力量训练的耐受量。\n\n#### B. 封闭式选择题\n\n**1. PDH复合体中E2酶的核心特征是什么？**\n\nA. 辅基为TPP，负责丙酮酸脱羧\nB. 辅基为硫辛酰胺，通过赖氨酸残基以共价酰胺键悬挂在E2核心上，像\"摆臂\"在三个活性中心间传递中间产物\nC. 辅基为FAD，负责重新氧化硫辛酰胺\nD. 直接被磷酸化后失活\n\n**2. 关于乳酸代谢，以下哪项描述正确？**\n\nA. 乳酸是代谢废物，只能通过肾脏排出体外\nB. LDH-5在骨骼肌中占优势，偏好催化丙酮酸→乳酸方向，关键意义在于再生NAD⁺以维持糖酵解运转\nC. Cori循环将乳酸在肝脏中重新合成葡萄糖不需要消耗ATP\nD. 乳酸只能通过MCT4转运出细胞\n\n**3. 每分子葡萄糖完全氧化约产生30-32 ATP，差异的原因是什么？**\n\nA. 不同个体的线粒体数量不同\nB. 胞质NADH通过线粒体膜的穿梭机制不同，苹果酸-天冬氨酸穿梭产出较高（约32 ATP），甘油-3-磷酸穿梭产出较低（约30 ATP）\nC. TCA循环在不同条件下产出的NADH数量不同\nD. 电子传递链的效率在不同组织中不同\n\n**4. PDH复合体的调控机制中，肌肉收缩时Ca²⁺的作用是什么？**\n\nA. Ca²⁺激活PDK使PDH磷酸化失活\nB. Ca²⁺抑制PDK并激活PDP，使PDH去磷酸化激活，打通有氧代谢通路\nC. Ca²⁺直接催化丙酮酸氧化脱羧\nD. Ca²⁺抑制LDH活性，减少乳酸生成\n\n**5. 关于乳酸阈值（LT）的临床意义，以下哪项最准确？**\n\nA. LT是血乳酸浓度开始加速上升的运动强度，比VO₂max更能预测耐力运动表现\nB. LT就是乳酸完全停止产生的运动强度\nC. LT只在有氧运动中有意义，与力量训练无关\nD. LT是固定不变的，不随训练水平改变\n\n---\n\n### 板块四：生物力学：自由体图分析深蹲\n\n#### A. 核心知识点回顾\n\n1. **自由体图的定义与步骤**。将研究对象从环境中隔离出来，标注所有外力和力矩的简图。步骤：确定研究对象→画出隔离体→标注所有外力（重力W、GRF、JRF、肌肉力）→建立坐标系→列出平衡方程（静态条件：ΣFx=0, ΣFy=0, ΣM=0）。自由体图是牛顿力学分析的起点，所有关节力矩计算都从这里开始。\n\n2. **逆动力学分析的方法论**。从最远端关节（踝关节）开始，逐步向近端求解。踝关节隔离小腿后只有一个未知关节力矩，方程可解。膝关节和髋关节依次使用前一步的结果。净力矩是该关节所有肌肉力矩的合力矩效果，不等于单块肌肉的力。\n\n3. **三个关节的力矩特征**。踝关节：GRF在踝前方产生背屈力矩，跖屈肌群（腓肠肌+比目鱼肌）产生对抗力矩。膝关节：GRF在膝前方产生屈曲力矩，股四头肌产生伸展力矩对抗。髋关节：躯干前倾时GRF产生屈曲力矩，臀大肌和腘绳肌产生伸展力矩对抗。\n\n4. **深度与杠铃位置的力学差异**。全蹲时膝关节力矩可能低于平行蹲（屈曲超过90°后力臂缩短），但髋关节力矩持续增大。低杠位置使躯干前倾增大→髋关节力矩增大、膝关节力矩减小。高杠位置则相反：躯干更直立→膝关节力矩增大、髋关节力矩减小。两种杠铃位置没有绝对优劣，选择取决于训练目标和个体情况。\n\n5. **自由体图思维在教练实践中的应用**。自由体图对教练的意义不在于手动计算关节力矩，而在于提供分析框架：从主观描述（\"感觉膝盖压力很大\"）到力学分析（\"膝关节伸展力矩过大\"）的转化。客户膝关节不适时，降低杠铃位置可以将力矩从膝关节转移到髋关节；客户髋关节弹响时，缩短活动范围或先改善髋关节灵活性是力学层面的合理选择。\n\n#### B. 封闭式选择题\n\n**1. 深蹲逆动力学分析为什么从踝关节开始？**\n\nA. 踝关节承受的力最大\nB. 踝关节隔离小腿段后只有一个未知的关节力矩，平衡方程可直接求解；从最远端逐步向近端推进，每一步使用前一步结果作为已知条件\nC. 踝关节是深蹲中最容易受伤的关节\nD. 这是国际惯例，没有力学原因\n\n**2. 低杠深蹲相比高杠深蹲，力学上的核心区别是什么？**\n\nA. 低杠位置使总负荷更大\nB. 低杠位置使杠铃重心相对于髋关节更靠后，躯干需要更大前倾角度以保持平衡，导致髋关节力矩增大、膝关节力矩减小\nC. 低杠位置使膝关节力矩增大\nD. 两种杠铃位置的总负荷和力矩分配完全相同\n\n**3. 全蹲时膝关节力矩可能低于平行蹲的力学原因是？**\n\nA. 全蹲时杠铃重量减轻\nB. 膝关节屈曲超过约90°后，GRF相对于膝关节的力臂开始缩短，导致膝伸展力矩需求下降\nC. 全蹲时股四头肌放松\nD. 全蹲时地面反作用力减小\n\n**4. 关于深蹲中踝关节的力学分析，以下哪项描述正确？**\n\nA. 深蹲下降阶段，膝关节屈曲角度增大使小腿前倾角度增大，GRF相对于踝关节的力臂增大，背屈力矩增大，跖屈肌群需产生更大的对抗力矩\nB. 踝关节力矩在深蹲中始终为零\nC. 踝关节力矩只与体重有关，与膝关节角度无关\nD. 踝关节力矩在整个深蹲过程中保持不变\n\n**5. 静态自由体图分析在深蹲中的适用条件是？**\n\nA. 深蹲全程都可以精确使用静态分析\nB. 仅在深蹲最低点或缓慢的向心/离心阶段，加速度接近零时，静态近似是合理的简化\nC. 静态分析只适用于空杆深蹲\nD. 静态分析不适用于任何深蹲场景\n\n---\n\n### 板块五：解剖：三角肌三束\n\n#### A. 核心知识点回顾\n\n1. **三束的起止点与力线分化**。三角肌止点统一为肱骨三角肌粗隆，起点分三部分。前束起自锁骨外侧1/3前面，力线从前上→后下，功能为肩屈曲（0-90°）、水平内收、内旋。中束起自肩峰外侧面，力线几乎纯外侧，功能为肩外展（15-90°范围的主要力量来源）。后束起自肩胛冈下唇，力线从后上→前下，功能为肩伸展、水平外展、外旋。\n\n2. **三角肌-肩袖的力学关系**。三角肌是肩关节运动主力（大扭矩），但收缩时产生向上剪切力，将肱骨头推向肩峰下间隙。肩袖通过压缩-中心化机制将肱骨头向下压入关节盂中心。冈上肌的力线几乎垂直向下，直接对抗三角肌的向上剪切力。没有肩袖稳定，三角肌每次收缩都在制造撞击风险。\n\n3. **三角肌粗隆处的肌腱融合模式**。三束肌纤维在肱骨外侧以不同角度和层次汇入。前束和中束在桡侧（近端）融合，后束在尺侧（远端）汇入。这种分层融合使不同束在不同肩关节角度下具有不同的力臂效率。\n\n4. **训练应用与失衡后果**。推类动作过度发达前束和胸大肌，拉类动作不足导致后束薄弱→肱骨头前移倾向→肩峰下间隙减小→撞击风险增大。训练方案应确保三束均衡：前束（前平举、上斜卧推）、中束（侧平举、直立划船）、后束（俯身飞鸟、面拉）。推类动作为主的训练者，后束训练量应不少于前束。\n\n5. **力臂随角度变化**。中束在外展0-15°时力臂较短，15°后迅速增大，90°附近达到峰值（这解释了为什么外展起始阶段主要由冈上肌启动）。前束在肩屈曲30-60°范围内力臂最大。后束在肩关节屈曲位（手臂前举状态下向后拉）时力臂最大。训练时应选择目标束力臂最优的关节角度范围。\n\n6. **肩袖优先与渐进负荷原则**。任何肩部训练前应先激活肩袖肌群（弹力带外旋、侧卧外旋），为三角肌的大力量输出提供稳定的肱骨头中心化平台。三角肌虽是大肌群，但肩关节的活动度和脆弱性要求负荷渐进。过顶推举的负荷增长应慢于深蹲和硬拉。\n\n#### B. 封闭式选择题\n\n**1. 三角肌三束中，肩关节外展15-90°范围内的主要力量来源是？**\n\nA. 前束\nB. 中束，其力线几乎垂直于肱骨长轴，力臂效率高\nC. 后束\nD. 三束贡献均等\n\n**2. 三角肌收缩时肱骨头有向上移位的趋势，对抗这一趋势的关键结构是？**\n\nA. 胸大肌\nB. 肩袖（尤其冈上肌），通过压缩-中心化机制将肱骨头向下压入关节盂中心\nC. 肱二头肌\nD. 斜方肌上束\n\n**3. 一个训练者长期以卧推和过头推举为主，忽略拉类动作和肩后束训练。最可能的力学后果是？**\n\nA. 肩关节稳定性增强\nB. 前束过度活跃加后束无力→肱骨头前移倾向增加→肩峰下间隙减小→肩峰下撞击风险增大\nC. 中束过度发达导致肩关节活动度增大\nD. 肩袖功能不受影响\n\n**4. 三角肌中束在外展动作中力臂效率最高的角度范围是？**\n\nA. 0-15°\nB. 15-90°\nC. 90-120°\nD. 120-180°\n\n**5. 三角肌粗隆处三束肌腱融合模式的特点是？**\n\nA. 三束以单一肌腱均匀附着在肱骨外侧\nB. 前束和中束在桡侧（近端）融合，后束在尺侧（远端）汇入，不同束在不同角度下具有不同的力臂效率\nC. 后束和中束融合，前束独立附着\nD. 三束完全独立，互不影响\n\n---\n\n## 第三部分：今日核心逻辑\n\n今天五个板块的共同主题是**检验与控制**。\n\n波普尔的否证主义要求科学理论接受严格检验。否证的演绎逻辑（否定后件式）在逻辑上是有效的，一次否证在逻辑上足以否定全称命题。确证和否证之间存在根本的不对称性。科学进步的路径是：问题→试探性理论→否证尝试→新问题。教练的训练方案是工作假设，必须包含明确的否证条件。\n\n斯多葛的控制二分法教我们区分可控与不可控。爱比克泰德的原始表述清晰而严格：判断、冲动、欲望和厌恶在我们能力范围之内，身体、财产、名声和职位不在。把注意力放在可控变量上，这是斯多葛伦理学的操作核心。从赫拉克利特的宇宙论到斯多葛的伦理实践，逻各斯从自然法则变成了生活准则。\n\n丙酮酸的两条命运展示了一个精确的代谢控制点。有氧条件下，PDH复合体将丙酮酸导入线粒体氧化通路，经过TCA循环和电子传递链产出约30-32 ATP。无氧条件下，LDH将丙酮酸还原为乳酸并再生NAD⁺，维持糖酵解持续运转。PDH的磷酸化-去磷酸化调控、产物抑制和Ca²⁺激活机制共同构成了这个代谢分叉点的控制网络。\n\n自由体图是力学检验的基本工具。从踝关节开始的逆动力学分析逐步求解三个关节的力矩，揭示了深蹲中力矩分布的内在逻辑。杠铃位置和训练深度的选择直接改变髋膝力矩分配，这不是\"偏好\"问题，是力学方程决定的。\n\n三角肌三束的功能分化要求训练中精确控制每束的激活。前束屈曲、中束外展、后束伸展，三束的均衡训练是肩部力学健康的基础。三角肌提供动力，肩袖提供稳定平台，两者的力学平衡决定了肩关节在运动中的安全边界。\n\n教练的任务：在所有层面建立检验标准和控制能力。用否证检验训练假说，用控制二分法管理注意力和期望，用代谢知识控制营养时机，用力学分析控制负荷分配，用解剖知识控制动作选择。检验与控制贯穿从科学方法论到分子代谢到宏观力学的每一个层面。\n"}}};

const $=id=>document.getElementById(id);
const app=$('app');
let CU=null,CV='login',CL=null;

function gU(){return JSON.parse(localStorage.getItem('eu')||'{}')}
function sU(u){localStorage.setItem('eu',JSON.stringify(u))}
function gS(){const s=localStorage.getItem('es');return s?JSON.parse(s):null}
function sS(u){localStorage.setItem('es',JSON.stringify(u))}
function cS(){localStorage.removeItem('es')}
function gP(u){return gU()[u]||{}}
function sP(u,d){const a=gU();a[u]=d;sU(a)}

(function(){const s=gS();if(s){CU=s;dash()}else login()})();

function login(){
CV='login';
app.innerHTML=`<div class="login-page"><div class="login-card">
<h1>涌现90天</h1><p class="sub">循证力量训练 · 课程学习平台</p>
<div class="fg"><label>用户名</label><input id="lu" placeholder="请输入用户名" autocomplete="off"></div>
<div class="fg"><label>邀请码</label><input id="lc" type="password" placeholder="请输入邀请码"></div>
<button class="login-btn" onclick="doL()">进入课程</button>
<div class="err" id="le"></div></div></div>`;
$('lc').onkeydown=e=>{if(e.key==='Enter')doL()};
$('lu').onkeydown=e=>{if(e.key==='Enter')$('lc').focus()};
}

function doL(){
const u=$('lu').value.trim(),c=$('lc').value.trim(),e=$('le');
if(!u){e.textContent='请输入用户名';e.style.display='block';return}
if(!VC.includes(c)){e.textContent='邀请码无效';e.style.display='block';return}
CU=u;sS(u);const a=gU();if(!a[u]){a[u]={};sU(a)}dash();
}

function doO(){cS();CU=null;CL=null;login()}

function dash(){
CV='dashboard';CL=null;
const p=gP(CU),keys=Object.keys(D.meta);
let done=0;
keys.forEach(k=>{const lp=p[k]||{};if(lp.tr&&lp.hc&&lp.wc)done++});
const pct=keys.length?Math.round(done/keys.length*100):0;
let cards='';
keys.forEach(k=>{
const m=D.meta[k],lp=p[k]||{};
let bc='b-ns',bt='未开始',t=0,d=0;
if(lp.tr){d++}t++;
if(lp.hc){d++}t++;
if(lp.wc){d++}t++;
const sp=Math.round(d/t*100);
if(lp.tr&&lp.hc&&lp.wc){bc='b-done';bt='✓ 已完成'}
else if(lp.tr||lp.hc||lp.wc){bc='b-ip';bt='学习中'}
cards+=`<div class="card" onclick="sL('${k}')">
<div class="lnum">Lesson ${m.num}</div><h3>${m.title}</h3>
<div class="thm">主题：${m.theme}</div>
<span class="badge ${bc}">${bt}</span>
<div class="card-prog"><span>${sp}% 完成</span><div class="card-prog-bar"><div class="card-prog-fill" style="width:${sp}%"></div></div></div>
</div>`;
});
app.innerHTML=`<div class="hdr"><div class="hdr-in">
<div class="hdr-brand" onclick="dash()">涌现90天</div>
<div class="hdr-right"><span>${CU}</span><button class="logout-btn" onclick="doO()">登出</button></div>
</div></div><div class="dash">

<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
<div class="prog-txt">已完成 ${done} / ${keys.length} 课（${pct}%）</div>
</div><div class="grid">${cards}</div></div>`;
}

function sL(lid){CV='lesson';CL=lid;rL()}

function rL(){
const lid=CL,m=D.meta[lid],c=D.content[lid];
app.innerHTML=`<div class="hdr"><div class="hdr-in">
<div class="hdr-brand" onclick="dash()">涌现90天</div>
<div class="hdr-right"><span>${CU}</span><button class="logout-btn" onclick="doO()">登出</button></div>
</div></div><div class="lp">
<div class="lp-hdr">
<button class="back-btn" onclick="dash()">← 返回课程列表</button>
<div class="lp-title">Lesson ${m.num}：${m.title}</div>
<div class="lp-theme">主题：${m.theme}</div>
</div>
<div class="tabs">
<button class="tab-btn active" onclick="sT('tb',this)">课本</button>
<button class="tab-btn" onclick="sT('hb',this)">学员手册</button>
<button class="tab-btn" onclick="sT('hw',this)">作业</button>
</div>
<div id="t-tb" class="tab-c active"></div>
<div id="t-hb" class="tab-c"></div>
<div id="t-hw" class="tab-c"></div>
</div>`;
// Textbook
marked.setOptions({breaks:true,gfm:true});
$('t-tb').innerHTML='<div class="md-render">'+marked.parse(c['课本'])+'</div>';
const pr=gP(CU);if(!pr[lid])pr[lid]={};pr[lid].tr=true;sP(CU,pr);
// Handbook & Homework
rHB(lid,c['学员手册'],'hb');
rHB(lid,c['作业'],'hw');
}

function sT(t,btn){
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
document.querySelectorAll('.tab-c').forEach(c=>c.classList.remove('active'));
btn.classList.add('active');$('t-'+t).classList.add('active');
}

function rHB(lid,md,mode){
const ct=$('t-'+mode);
const pr=gP(CU),lp=pr[lid]||{},st=lp[mode+'S']||{};
// Parse the markdown to find interactive elements, render rest as-is
const sections=parseMD(md);
let html='';

sections.forEach((sec,i)=>{
if(sec.type==='core'){
html+=`<div class="core-logic"><h3>今日核心逻辑</h3>${marked.parse(sec.body)}</div>`;
}else if(sec.type==='quiz'){
html+=rQuiz(sec,lid,mode,st);
}else if(sec.type==='kp'){
const cid=`${mode}-${lid}-${i}`;
html+=`<div class="kc" id="kc-${cid}">
<div class="kc-h" onclick="tC('kc-${cid}')">
<input type="checkbox" ${st['ck_'+i]?'checked':''} onclick="event.stopPropagation();tK('${lid}','${mode}','ck_${i}',this.checked)" style="width:18px;height:18px;accent-color:var(--primary);flex-shrink:0">
<span class="t">${escH(sec.title)}</span>
<span class="arr">▶</span>
</div>
<div class="kc-b"><div class="md-render" style="box-shadow:none;padding:0">${marked.parse(sec.body)}</div></div>
</div>`;
}else{
html+=`<div class="md-render" style="box-shadow:none;padding:0">${marked.parse(sec.raw)}</div>`;
}
});

// Add completion button
const isDone=mode==='hb'?lp.hc:lp.wc;
const label=mode==='hb'?'标记手册已学习':'标记作业已完成';
const fn=mode==='hb'?'tHC':'tWC';
html+=`<button class="mark-btn ${isDone?'done':''}" onclick="${fn}('${lid}')">${isDone?'✓ 已完成':'✓ '+label}</button>`;
ct.innerHTML=`<div class="hw-section">${html}</div>`;
// Post-process: inject inputs into knowledge map tables
setTimeout(()=>{
  const tables=ct.querySelectorAll('table');
  tables.forEach(tbl=>{
    const ths=tbl.querySelectorAll('th');
    let ansCol=-1;
    ths.forEach((th,i)=>{if(th.textContent.includes('你的回答'))ansCol=i});
    if(ansCol<0)return;
    tbl.classList.add('kt');
    const rows=tbl.querySelectorAll('tbody tr');
    let tableIdx=Array.from(ct.querySelectorAll('table')).indexOf(tbl);
    rows.forEach((row,ri)=>{
      const cells=row.querySelectorAll('td');
      const cell=cells[ansCol];
      if(!cell)return;
      const fid=`fill-${lid}-${mode}-${tableIdx}-${ri}`;
      const sv=localStorage.getItem('course_fill_'+fid.replace(/-/g,'_'));
      const filled=sv?'filled':'';
      cell.innerHTML=`<input type="text" id="${fid}" class="${filled}" placeholder="请填写..." value="${escH(sv||'')}" />`;
      const inp=cell.querySelector('input');
      inp.addEventListener('click',e=>e.stopPropagation());
      inp.addEventListener('input',e=>{
        const v=e.target.value;
        if(v){localStorage.setItem('course_fill_'+fid.replace(/-/g,'_'),v);e.target.classList.add('filled')}
        else{localStorage.removeItem('course_fill_'+fid.replace(/-/g,'_'));e.target.classList.remove('filled')}
      });
    });
    // Add answer toggle button after table
    const ansKey=lid;
    const ansMode=mode;
    const ansData=ANSWERS[ansKey]&&ANSWERS[ansKey][ansMode];
    if(ansData&&ansData.length>0){
      const btnId=`ans-btn-${mode}-${lid}-${tableIdx}`;
      const panelId=`ans-panel-${mode}-${lid}-${tableIdx}`;
      const submitBtnId=`fill-submit-${mode}-${lid}-${tableIdx}`;
      const scoreId=`fill-score-${mode}-${lid}-${tableIdx}`;
      let ansHtml='<button class="fill-submit-btn" id="'+submitBtnId+'" onclick="submitFills(\''+lid+'\',\''+mode+'\','+tableIdx+')">提交答案</button>';
      ansHtml+='<div class="fill-score" id="'+scoreId+'" style="display:none"></div>';
      ansHtml+='<button class="ans-toggle" id="'+btnId+'" onclick="toggleAnswers(\''+panelId+'\',\''+btnId+'\')">显示参考答案与课本原文</button>';
      ansHtml+='<div class="ans-panel" id="'+panelId+'" style="display:none"><h4>参考答案与课本原文</h4>';
      ansData.forEach((item,i)=>{
        ansHtml+='<div class="ans-item"><strong>'+String(i+1)+'.</strong> <span class="ans-a">答：'+escH(item.a)+'</span><div class="ans-ref">📖 '+escH(item.ref)+'</div></div>';
      });
      ansHtml+='</div>';
      tbl.insertAdjacentHTML('afterend',ansHtml);
    }
  });
},0);
}

function parseMD(md){
const secs=[];
const lines=md.split('\n');
let i=0;

while(i<lines.length){
const l=lines[i];

// Core logic section
if(l.includes('今日核心逻辑')||(l.startsWith('## 第三部分')&&l.includes('核心逻辑'))){
let body='';i++;
while(i<lines.length){body+=lines[i]+'\n';i++}
secs.push({type:'core',body:body.trim()});continue;
}

// Detect section headers (### 板块...)
if(l.startsWith('### ')){
const title=l.replace(/^### /,'').replace(/\*\*/g,'');
i++;
let buf=[];
// Collect until next ### or ## section boundary
while(i<lines.length){
const nl=lines[i];
if(nl.startsWith('### 板块')||nl.startsWith('## 第三部分')||nl.includes('今日核心逻辑'))break;
buf.push(nl);i++;
}
const block=buf.join('\n');

// Parse the block for knowledge points and quizzes
const subParts=parseBlock(block,title);
secs.push(...subParts);
continue;
}

// Knowledge point blocks starting with numbered items
if(/^\d+\.\s\*\*/.test(l)){
let buf=[];
while(i<lines.length&&(/^\d+\.\s/.test(lines[i])||lines[i].startsWith('  ')||lines[i].trim()===''||lines[i].match(/^\*\*[^*]+\*\*/))){
buf.push(lines[i]);i++;
if(i<lines.length&&lines[i].startsWith('####'))break;
if(i<lines.length&&/^#{1,3}\s/.test(lines[i])&&!lines[i].startsWith('####'))break;
}
const txt=buf.join('\n').trim();
if(txt)secs.push({type:'kp',title:txt.substring(0,80),body:txt});
continue;
}

// Quiz questions (bold numbered with A-D options)
if(/^\*\*\d+\.\s/.test(l)){
let qBuf=[l];i++;
while(i<lines.length){
const nl=lines[i];
if(nl.startsWith('**')&&/^\*\*\d+/.test(nl))break;
if(nl.startsWith('##'))break;
if(nl.startsWith('---')){i++;break}
qBuf.push(nl);i++;
}
const qTxt=qBuf.join('\n').trim();
if(/[A-D]\.\s/.test(qTxt)){
const parsed=parseQ(qTxt);
if(parsed)secs.push(parsed);
else secs.push({type:'text',raw:qTxt});
}else{
secs.push({type:'text',raw:qTxt});
}
continue;
}

// Collect other content
let buf=[l];i++;
// Accumulate until we hit a recognizable pattern
while(i<lines.length){
const nl=lines[i];
if(nl.startsWith('### ')||nl.startsWith('## ')||nl.includes('今日核心逻辑'))break;
if(/^\*\*\d+\.\s/.test(nl))break;
if(nl.trim()==='---'){buf.push(nl);i++;continue}
buf.push(nl);i++;
}
const txt=buf.join('\n').trim();
if(txt)secs.push({type:'text',raw:txt});
}
return secs;
}

function parseBlock(block,title){
const parts=[];
const lines=block.split('\n');
let i=0;

while(i<lines.length){
const l=lines[i];

// Section sub-headers
if(l.startsWith('#### A.')||l.startsWith('#### A ')){
// Knowledge review
let buf=[];i++;
while(i<lines.length&&!lines[i].startsWith('#### B')){buf.push(lines[i]);i++}
const txt=buf.join('\n').trim();
if(txt)parts.push({type:'kp',title:title+' · 知识点回顾',body:txt});
continue;
}
if(l.startsWith('#### B.')||l.startsWith('#### B ')){
// Quiz section
i++;
while(i<lines.length&&!lines[i].startsWith('#### C')){
const ql=lines[i];
if(/^\*\*\d+\.\s/.test(ql)){
let qBuf=[ql];i++;
while(i<lines.length){
const nl=lines[i];
if(/^\*\*\d+\.\s/.test(nl))break;
if(nl.startsWith('#### C'))break;
if(nl.trim()==='---'){i++;break}
qBuf.push(nl);i++;
}
const qt=qBuf.join('\n').trim();
if(/[A-D]\.\s/.test(qt)){const p=parseQ(qt);if(p)parts.push(p);else parts.push({type:'text',raw:qt})}
else if(qt)parts.push({type:'text',raw:qt});
continue;
}
i++;
}
continue;
}
if(l.startsWith('#### C.')){
// Essay section
i++;
while(i<lines.length){
const nl=lines[i];
if(nl.startsWith('####')||nl.startsWith('### 板块')||nl.startsWith('## 第三部分'))break;
if(nl.trim()==='---'){i++;break}
let eBuf=[nl];i++;
while(i<lines.length){
const nn=lines[i];
if(/^\*\*\d+\.\s/.test(nn)||nn.startsWith('####')||nn.startsWith('### 板块')||nn.startsWith('## 第三部分')||nn.trim()==='---')break;
eBuf.push(nn);i++;
}
const et=eBuf.join('\n').trim();
if(et)parts.push({type:'text',raw:et});
}
continue;
}

if(l.trim()===''||l.trim()==='---'){i++;continue}
i++;
}
return parts;
}

function parseQ(txt){
const lines=txt.split('\n');
let q='',opts=[],curOpt=null;
for(let l of lines){
l=l.trim();if(!l)continue;
l=l.replace(/^\*\*/,'').replace(/\*\*$/,'').replace(/\*\*/g,'');
const om=l.match(/^([A-D])\.\s*(.+)$/);
if(om){
if(curOpt)opts.push(curOpt);
curOpt={letter:om[1],text:om[2]};
}else if(!q){
q=l.replace(/^\d+\.\s*/,'');
}else if(curOpt){
curOpt.text+=' '+l;
}else{
q+=' '+l;
}
}
if(curOpt)opts.push(curOpt);
if(!opts.length)return null;
// Detect answer: longest option is usually correct in educational materials
let longest=opts[0];
opts.forEach(o=>{if(o.text.length>longest.text.length)longest=o});
return{type:'quiz',question:q,options:opts,answer:longest.letter};
}

function rQuiz(sec,lid,mode,st){
if(!sec||!sec.question)return'';
const qid='q_'+hCode(sec.question);
const answered=st[qid+'_a'];
const selected=st[qid+'_s'];
let h=`<div class="qb"><div class="q">${escH(sec.question)}</div>`;
if(sec.options){
sec.options.forEach(o=>{
let c='qo';
if(answered){
if(o.letter===sec.answer)c+=' ans';
else if(o.letter===selected)c+=' wrong';
}else if(selected===o.letter)c+=' sel';
h+=`<div class="${c}" onclick="selO('${lid}','${mode}','${qid}','${o.letter}',this)">${o.letter}. ${escH(o.text)}</div>`;
});
}
if(!answered)h+=`<button class="qsub" onclick="subQ('${lid}','${mode}','${qid}')">提交</button>`;
if(answered){
const ok=selected===sec.answer;
h+=`<div class="qfb ${ok?'ok':'no'}">${ok?'✓ 回答正确':'✗ 回答错误，正确答案是 '+sec.answer}</div>`;
}
h+='</div>';return h;
}

function tC(id){
const el=$(id);if(!el)return;
const b=el.querySelector('.kc-b'),a=el.querySelector('.arr');
if(b)b.classList.toggle('open');
if(a)a.classList.toggle('open');
}

function tK(lid,mode,key,val){
const p=gP(CU);if(!p[lid])p[lid]={};
const sk=mode+'S';if(!p[lid][sk])p[lid][sk]={};
p[lid][sk][key]=val;sP(CU,p);
}

function selO(lid,mode,qid,letter,el){
const p=gP(CU);if(!p[lid])p[lid]={};
const sk=mode+'S';if(!p[lid][sk])p[lid][sk]={};
if(p[lid][sk][qid+'_a'])return;
p[lid][sk][qid+'_s']=letter;sP(CU,p);
const blk=el.closest('.qb');
blk.querySelectorAll('.qo').forEach(o=>o.classList.remove('sel'));
el.classList.add('sel');
}

function subQ(lid,mode,qid){
const p=gP(CU);if(!p[lid])p[lid]={};
const sk=mode+'S';if(!p[lid][sk])p[lid][sk]={};
if(!p[lid][sk][qid+'_s']){alert('请先选择一个选项');return}
p[lid][sk][qid+'_a']=true;sP(CU,p);
rL();
}

function tHC(lid){const p=gP(CU);if(!p[lid])p[lid]={};p[lid].hc=!p[lid].hc;sP(CU,p);rL()}
function tWC(lid){const p=gP(CU);if(!p[lid])p[lid]={};p[lid].wc=!p[lid].wc;sP(CU,p);rL()}

function hCode(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return Math.abs(h).toString(36)}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function fuzzyMatch(user,answer){
  const norm=s=>s.replace(/[\s\u3000，。、；：""''（）【】《》！？,.!?;:""'\(\)\[\]]/g,'').toLowerCase();
  const u=norm(user),a=norm(answer);
  if(!u)return false;
  if(u===a)return true;
  if(u.includes(a)||a.includes(u))return true;
  // Check if core keywords match (60% threshold)
  const aChars=[...new Set(a.split(''))];
  let matched=0;
  aChars.forEach(c=>{if(u.includes(c))matched++});
  if(aChars.length>0&&matched/aChars.length>=0.6)return true;
  // Check keyword overlap for longer answers
  const aSegs=a.split(/[，、；;\s]+/).filter(s=>s.length>=2);
  if(aSegs.length===0)return false;
  let hitSegs=0;
  aSegs.forEach(seg=>{if(u.includes(seg))hitSegs++});
  if(hitSegs/aSegs.length>=0.5)return true;
  return false;
}

function submitFills(lid,mode,tableIdx){
  const ansData=ANSWERS[lid]&&ANSWERS[lid][mode];
  if(!ansData)return;
  const prefix='fill-'+lid+'-'+mode+'-'+tableIdx+'-';
  let correct=0;
  const total=ansData.length;
  // Remove old results
  document.querySelectorAll('.fill-result[data-tidx="'+tableIdx+'"]').forEach(el=>el.remove());
  ansData.forEach((item,ri)=>{
    const fid=prefix+ri;
    const inp=document.getElementById(fid);
    if(!inp)return;
    const userVal=inp.value.trim();
    const isCorrect=fuzzyMatch(userVal,item.a);
    if(isCorrect)correct++;
    // Style input
    inp.classList.remove('input-correct','input-wrong');
    inp.classList.add(isCorrect?'input-correct':'input-wrong');
    // Create result element after the input's parent cell
    const cell=inp.closest('td');
    if(cell){
      const resId=fid+'-result';
      let existing=document.getElementById(resId);
      if(existing)existing.remove();
      const div=document.createElement('div');
      div.id=resId;
      div.className='fill-result show '+(isCorrect?'correct':'wrong');
      div.setAttribute('data-tidx',tableIdx);
      if(isCorrect){
        div.innerHTML='<span class="correct-mark">✓ 正确</span>';
      }else{
        div.innerHTML='<span class="wrong-mark">✗ 不匹配</span><br>你的回答：'+(userVal?escH(userVal):'<em>未填写</em>')+'<br>正确答案：<span class="correct-mark">'+escH(item.a)+'</span>';
      }
      div.innerHTML+='<div class="ref-text">📖 '+escH(item.ref)+'</div>';
      cell.appendChild(div);
    }
  });
  // Show score
  const scoreEl=document.getElementById('fill-score-'+mode+'-'+lid+'-'+tableIdx);
  if(scoreEl){
    scoreEl.style.display='block';
    scoreEl.innerHTML='得分：<span class="score-num">'+correct+' / '+total+'</span> 正确';
  }
  // Change submit button to reset
  const btn=document.getElementById('fill-submit-'+mode+'-'+lid+'-'+tableIdx);
  if(btn){
    btn.textContent='重新作答';
    btn.className='fill-reset-btn';
    btn.setAttribute('onclick',"resetFills('"+lid+"','"+mode+"',"+tableIdx+")");
  }
}

function resetFills(lid,mode,tableIdx){
  const ansData=ANSWERS[lid]&&ANSWERS[lid][mode];
  if(!ansData)return;
  const prefix='fill-'+lid+'-'+mode+'-'+tableIdx+'-';
  ansData.forEach((item,ri)=>{
    const fid=prefix+ri;
    const inp=document.getElementById(fid);
    if(!inp)return;
    inp.value='';
    inp.classList.remove('filled','input-correct','input-wrong');
    localStorage.removeItem('course_fill_'+fid.replace(/-/g,'_'));
    // Remove result div
    const resEl=document.getElementById(fid+'-result');
    if(resEl)resEl.remove();
  });
  // Hide score
  const scoreEl=document.getElementById('fill-score-'+mode+'-'+lid+'-'+tableIdx);
  if(scoreEl)scoreEl.style.display='none';
  // Change button back to submit
  const btn=document.getElementById('fill-submit-'+mode+'-'+lid+'-'+tableIdx);
  if(btn){
    btn.textContent='提交答案';
    btn.className='fill-submit-btn';
    btn.setAttribute('onclick',"submitFills('"+lid+"','"+mode+"',"+tableIdx+")");
  }
}

function toggleAnswers(panelId,btnId){
  const panel=document.getElementById(panelId);
  const btn=document.getElementById(btnId);
  if(!panel)return;
  if(panel.style.display==='none'){
    panel.style.display='block';
    btn.textContent='隐藏参考答案';
  }else{
    panel.style.display='none';
    btn.textContent='显示参考答案与课本原文';
  }
}
